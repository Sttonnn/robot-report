<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกการประชุม Project Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* 5 พ.ย. Weekly Meeting Minutes (MoM) · สไตล์ Portal (โค้ง ไล่สี เงา) · กรม→ฟ้า→เขียวอมฟ้า
     เก็บ Supabase mom_meetings (id, rec jsonb) · ไม่มี AI (ผู้ใช้เลือก) · เสียง = วางข้อความถอดเสียง · ใส่รหัสก่อนเข้า · ส่ง Task เข้า Daily Task ด้วยปุ่ม */
  :root {
    --bg: #eef2f8; --card: #ffffff; --ink: #14213d; --ink2: #50607e; --ink3: #8a97ae; --line: #dfe5ef; --soft: #f5f7fb;
    --navy: #0f2a5c; --navy2: #1d4fa8; --teal: #0e9f9a; --gold: #f2a516; --gold-soft: #fff4dc; --gold-ink: #8a5a00;
    --ok: #0f9a6e; --ok-soft: #e3f6ee; --prog: #2563eb; --prog-soft: #e6eefe; --red: #d92d20; --red-soft: #fdeceb;
    --shadow: 0 10px 28px rgba(15, 42, 92, .08);
    --f-disp: "Prompt", "Anuphan", system-ui, sans-serif; --f-body: "Anuphan", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; padding: 18px 16px 48px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--f-disp); margin: 0; }
  .wrap { max-width: 1360px; margin: 0 auto; display: grid; gap: 18px; }

  .hero { border-radius: 28px; padding: 22px 26px; color: #fff; background: linear-gradient(115deg, var(--navy) 0%, var(--navy2) 58%, var(--teal) 125%);
    box-shadow: var(--shadow); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.14); }
  .hero .ic { width: 54px; height: 54px; border-radius: 16px; background: rgba(255,255,255,.14); display: grid; place-items: center; flex: none; }
  .hero .t { flex: 1 1 300px; min-width: 0; }
  .hero small { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .8; font-weight: 600; }
  .hero h1 { font-size: 26px; line-height: 1.2; }
  .sync { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.16); white-space: nowrap; }
  .sync.bad { background: var(--gold); color: #2b1b00; }

  .main { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }
  .side { background: var(--card); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 8px; position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; }
  .side h3 { font-size: 12.5px; color: var(--ink3); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px 0; }
  .pbtn { border: 0; border-radius: 14px; padding: 11px 14px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--navy), var(--navy2)); box-shadow: 0 8px 18px rgba(29,79,168,.25); }
  .gbtn { border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-weight: 600; background: var(--soft); }
  .gbtn.sm { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
  .gbtn.danger { color: var(--red); } .gbtn.danger.arm { background: var(--red); color: #fff; border-color: var(--red); }
  .srch { border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 8px 12px; width: 100%; }
  .wk { display: grid; gap: 1px; text-align: left; border: 0; background: var(--soft); border-radius: 14px; padding: 9px 12px; }
  .wk.on { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: #fff; }
  .wk b { font-family: var(--f-disp); font-size: 14.5px; } .wk small { font-size: 12px; opacity: .8; }
  .wk .dr { color: var(--gold-ink); font-weight: 700; } .wk.on .dr { color: #ffd37a; }
  .tip { padding: 10px 12px; border-radius: 14px; background: var(--gold-soft); color: var(--gold-ink); font-size: 13px; }
  .tip b { display: block; font-size: 22px; font-family: var(--f-disp); }

  .col { display: grid; gap: 18px; min-width: 0; }
  .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 14px; min-width: 0; }
  .ch { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ch .n { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--navy), var(--navy2)); color: #fff; display: grid; place-items: center; font-family: var(--f-mono); flex: none; }
  .ch h2 { font-size: 18.5px; flex: 1; min-width: 0; }
  .hint { font-size: 13px; color: var(--ink2); }
  .form { display: grid; grid-template-columns: 90px repeat(4, minmax(0, 1fr)); gap: 10px; }
  .fld { display: grid; gap: 4px; min-width: 0; } .fld.w2 { grid-column: span 2; } .fld.w4 { grid-column: span 4; } .fld.all { grid-column: 1 / -1; }
  .fld label { font-size: 12.5px; font-weight: 600; color: var(--ink2); }
  .fld input, .fld textarea { border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 9px 12px; width: 100%; }
  textarea { resize: vertical; }
  #notes { min-height: 110px; }
  details.box { border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; background: var(--soft); }
  details.box summary { cursor: pointer; font-weight: 600; }
  details.box ol { margin: 8px 0 0; padding-left: 20px; font-size: 13.5px; color: var(--ink2); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink2); }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
  .tw { overflow-x: auto; border-radius: 16px; border: 1px solid var(--line); }
  table.rt { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 14px; }
  .rt th { background: var(--navy); color: #fff; text-align: left; font-weight: 600; padding: 9px 10px; font-size: 13px; white-space: nowrap; }
  .rt td { border-top: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
  .rt tr.carry td:first-child { box-shadow: inset 3px 0 0 var(--ink3); }
  .rt textarea, .rt input[type=text], .rt input[type=date] { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 8px; min-height: 36px; }
  .rt textarea { overflow: hidden; line-height: 1.45; }
  .rt textarea:hover, .rt input:hover { border-color: var(--line); } .rt textarea:focus, .rt input:focus { background: var(--prog-soft); border-color: var(--prog); outline: none; }
  .rt tr.red textarea { color: var(--red); }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; margin-top: 8px; }
  .tag.carry { background: var(--soft); color: var(--ink2); } .tag.new { background: var(--prog-soft); color: var(--prog); } .tag.sent { background: var(--ok-soft); color: var(--ok); }
  select.st { border: 0; border-radius: 999px; padding: 6px 10px; font-weight: 700; font-size: 12.5px; margin-top: 4px; }
  select.st.done { background: var(--ok-soft); color: var(--ok); } select.st.prog { background: #fff7c2; color: #7a5b00; } select.st.todo { background: var(--soft); color: var(--ink2); }
  .ac { white-space: nowrap; } .ac button { border: 0; background: var(--soft); border-radius: 8px; width: 28px; height: 28px; font-weight: 800; margin-top: 4px; }
  .ac button.x { color: var(--red); } .ac button.x.arm { background: var(--red); color: #fff; }
  .ac label { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--red); margin-left: 4px; }
  .empty { padding: 26px; text-align: center; color: var(--ink3); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .paper { background: #fff; color: #111; border-radius: 6px; box-shadow: 0 2px 14px rgba(0,0,0,.16); padding: 26px; max-width: 840px; margin: 0 auto; width: 100%; font-size: 13px; overflow-x: auto; }
  .paper table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13px; }
  .paper th, .paper td { border: 1px solid #555; padding: 6px 8px; color: #111; vertical-align: top; }
  .paper .lbl { font-weight: 700; width: 26%; }
  .paper .ttl { text-align: center; font-weight: 700; font-size: 16px; }
  .paper .nv { background: #002060; color: #fff; text-align: center; }
  .paper .done { background: #00b050; } .paper .prog { background: #ffff00; }
  .paper .redt td { color: #e00; }
  .paper .sec { font-weight: 700; margin: 16px 0 6px; font-size: 15px; }
  .paper .lg { display: flex; justify-content: flex-start; margin-bottom: 12px; } .paper .lg img { height: 46px; }

  .dlg { position: fixed; inset: 0; z-index: 70; background: rgba(10, 20, 40, .45); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 12px; overflow: auto; }
  .dbox { background: var(--card); border-radius: 22px; box-shadow: 0 24px 60px rgba(0,0,0,.3); width: min(760px, 100%); padding: 20px; display: grid; gap: 12px; }
  .dbox h3 { font-size: 18px; } .dbox table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .dbox th { text-align: left; font-size: 12.5px; color: var(--ink2); padding: 6px; border-bottom: 1px solid var(--line); } .dbox td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .dbox select { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; background: var(--soft); }
  .ft { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; } .ft .sp { margin-right: auto; }
  .err { color: var(--red); font-size: 13px; font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 90; max-width: calc(100% - 32px); }

  /* หน้ารหัส */
  .gate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: linear-gradient(135deg, #0b1f47, #14408f 60%, #0b6f6b); }
  .gbox { background: #fff; color: var(--ink); border-radius: 24px; width: min(400px, 100%); overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.35); }
  .gbox .gh { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: #fff; padding: 22px; display: flex; gap: 12px; align-items: center; }
  .gbox .gh img { height: 38px; border-radius: 6px; background: #fff; padding: 2px; }
  .gbox .gb { padding: 22px; display: grid; gap: 10px; }
  .gbox input { border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; font-size: 16px; }

  /* ---- 5 พ.ย. รอบ 2: หน้ารายงาน (เลือก + นำเสนอ) แยกจากหน้าทำรายงาน · ผู้เข้าร่วมเลือกจากรายชื่อ · เวลาเป็นช่วง ---- */
  .hbtn { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; color: #fff; background: rgba(255,255,255,.14); }
  .hbtn.on { background: #fff; color: var(--navy); }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tools .srch { width: auto; flex: 1 1 220px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }
  .mc { background: var(--card); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; border: 2px solid transparent; }
  .mc.latest { border-color: var(--navy2); }
  .mc .top { display: flex; gap: 12px; align-items: center; }
  .mc .wno { width: 62px; height: 62px; border-radius: 18px; background: linear-gradient(135deg, var(--navy), var(--navy2)); color: #fff; display: grid; place-items: center; font-family: var(--f-disp); font-size: 22px; font-weight: 700; flex: none; }
  .mc h3 { font-size: 17px; } .mc .sub { font-size: 13px; color: var(--ink2); }
  .mc .bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--soft); }
  .mc .bar i { display: block; height: 100%; }
  .mc .nums { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); } .mc .nums b { color: var(--ink); font-size: 15px; }
  .mc .acts { display: flex; gap: 8px; flex-wrap: wrap; } .mc .acts .pbtn { flex: 1; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink); white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .crumb { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--soft); min-height: 48px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 13.5px; }
  .chip small { color: var(--ink3); } .chip button { border: 0; background: var(--soft); border-radius: 50%; width: 22px; height: 22px; line-height: 1; color: var(--ink2); }
  .addp { border: 1px dashed var(--navy2); background: transparent; color: var(--navy2); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13.5px; }
  .fld select { border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 9px 12px; width: 100%; }
  .trange { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .trange select { width: auto; flex: 1 1 110px; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; } .presets button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
  .presets button.on { background: var(--navy2); color: #fff; border-color: var(--navy2); }
  .plist { display: grid; gap: 6px; max-height: 46vh; overflow: auto; }
  .prow { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--soft); cursor: pointer; }
  .prow input[type=checkbox] { width: 18px; height: 18px; } .prow small { color: var(--ink2); }
  .pform { display: grid; grid-template-columns: 2fr 2fr 1fr auto; gap: 8px; align-items: end; padding: 10px; border: 1px dashed var(--line); border-radius: 14px; }
  .pform input { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; background: var(--card); }
  .ptbl input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; background: var(--card); }
  .ac label.evp { color: var(--navy2); }
  tr.evp td:first-child { box-shadow: inset 3px 0 0 var(--gold); }

  /* โหมดนำเสนอ: เวที 1600×900 ย่อ/ขยายให้พอดีจอ */
  .pres { position: fixed; inset: 0; z-index: 80; background: #0a1430; display: flex; flex-direction: column; }
  .pres .bar2 { display: flex; gap: 8px; align-items: center; padding: 10px 14px; color: #cfd8ee; font-size: 13.5px; flex-wrap: wrap; }
  .pres .bar2 button { border: 0; border-radius: 10px; padding: 7px 12px; background: rgba(255,255,255,.1); color: #fff; font-weight: 600; }
  .pres .bar2 .sp { flex: 1; } .pres .bar2 button:disabled { opacity: .35; cursor: default; }
  .pres .vp { flex: 1; position: relative; overflow: hidden; }
  .stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: center; }
  .sl { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: #f4f6fb; color: #14213d; font-family: var(--f-body); display: none; }
  .sl.on { display: flex; flex-direction: column; }
  .sl .sh { padding: 44px 64px 18px; display: flex; align-items: center; gap: 20px; }
  .sl .sh h2 { font-size: 46px; color: #0f2a5c; flex: 1; line-height: 1.15; }
  .sl .sh .k { font-size: 18px; font-weight: 600; color: #1d4fa8; letter-spacing: .08em; text-transform: uppercase; }
  .sl .sh img { height: 54px; }
  .sl .sb { flex: 1; padding: 6px 64px 30px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  .sl .sf { padding: 0 64px 22px; display: flex; justify-content: space-between; color: #8a97ae; font-size: 16px; }
  .sl.cover { background: linear-gradient(120deg, #0b1f47 0%, #14408f 58%, #0e9f9a 130%); color: #fff; }
  .cover .cv { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 70px 90px; gap: 22px; }
  .cover .logo { background: #fff; border-radius: 14px; padding: 10px 14px; width: max-content; } .cover .logo img { height: 64px; display: block; }
  .cover .kk { font-size: 24px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; font-weight: 600; }
  .cover h1 { font-size: 78px; line-height: 1.1; } .cover .wbig { font-family: var(--f-disp); font-size: 140px; line-height: 1; font-weight: 700; color: #ffd37a; }
  .cover .meta { display: flex; gap: 40px; font-size: 28px; flex-wrap: wrap; } .cover .meta span { opacity: .75; font-size: 20px; display: block; }
  .cover .who { display: flex; flex-wrap: wrap; gap: 10px; } .cover .who div { background: rgba(255,255,255,.14); border-radius: 999px; padding: 8px 18px; font-size: 20px; }
  .cover .who small { opacity: .75; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .kpi { background: #fff; border-radius: 24px; padding: 26px 28px; box-shadow: 0 10px 28px rgba(15,42,92,.08); display: grid; gap: 6px; border-top: 8px solid var(--c); }
  .kpi .l { font-size: 22px; font-weight: 600; color: #50607e; } .kpi .v { font-family: var(--f-disp); font-size: 96px; line-height: 1; font-weight: 700; color: var(--c); }
  .kpi .d { font-size: 19px; color: #50607e; }
  .bigbar { display: flex; height: 40px; border-radius: 14px; overflow: hidden; background: #e5e9f2; }
  .bigbar i { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px; font-style: normal; }
  .note2 { font-size: 22px; color: #50607e; background: #fff; border-radius: 18px; padding: 18px 24px; }
  .items { display: grid; gap: 14px; }
  .it { background: #fff; border-radius: 20px; padding: 18px 24px; display: grid; grid-template-columns: 1fr auto; gap: 6px 24px; box-shadow: 0 6px 18px rgba(15,42,92,.06); border-left: 10px solid var(--c, #1d4fa8); }
  .it .p { font-size: 18px; font-weight: 700; color: #1d4fa8; } .it .t { font-size: 26px; font-weight: 600; line-height: 1.3; grid-column: 1; }
  .it .r { grid-column: 2; grid-row: 1 / span 3; text-align: right; display: grid; gap: 8px; align-content: center; font-size: 20px; color: #50607e; min-width: 260px; }
  .it .o { font-size: 20px; color: #50607e; }
  .pill { display: inline-block; padding: 6px 16px; border-radius: 999px; font-weight: 700; font-size: 18px; justify-self: end; }
  .pill.done { background: #d6f3e7; color: #0a7a56; } .pill.prog { background: #fff3b0; color: #6b5000; } .pill.todo { background: #e8ecf4; color: #50607e; }
  .flag { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 16px; background: #fde8e6; color: #b42318; margin-right: 6px; }
  .flag.evp { background: #fff1d6; color: #8a5a00; }
  .empty2 { flex: 1; display: grid; place-items: center; font-size: 30px; color: #8a97ae; background: #fff; border-radius: 24px; }
  .stbl { width: 100%; border-collapse: collapse; font-size: 21px; background: #fff; border-radius: 18px; overflow: hidden; }
  .stbl th { background: #002060; color: #fff; text-align: left; padding: 14px 16px; font-size: 19px; }
  .stbl td { padding: 12px 16px; border-top: 1px solid #e3e8f1; vertical-align: top; }
  .stbl td.done { background: #00b050; color: #fff; font-weight: 700; } .stbl td.prog { background: #ffff00; font-weight: 700; } .stbl tr.redt td { color: #d00; }
  /* 5 พ.ย. รอบ 3: หน้ารายงาน = รายการ (ผู้ใช้สั่ง) · ดูรายงาน = หน้าเดียวแบบไฟล์ Word */
  .mlist { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
  .mlist table { width: 100%; border-collapse: collapse; font-size: 14.5px; min-width: 760px; }
  .mlist th { background: var(--navy); color: #fff; text-align: left; font-weight: 600; font-size: 13px; padding: 10px 14px; white-space: nowrap; }

const GATE_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";

const TH_M = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

const clean = v => typeof v === "string" ? v.replace(/[<>"'`]/g, c => ({ "<": "‹", ">": "›", '"': "″", "'": "′", "`": "′" })[c]) : Array.isArray(v) ? v.map(clean) : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, clean(x)])) : v;
const toast = t => { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2800); };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- หน้ารหัส (จำวันละครั้งในเครื่อง) ---------- */
async function sha(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
function gateOk() { try { const g = JSON.parse(localStorage.getItem("pcg-mom-ok") || "null"); return g && g.h === GATE_HASH && g.day === TODAY; } catch (e) { return false; } }
if (gateOk()) $("gate").hidden = true; else setTimeout(() => $("gPw").focus(), 50);
$("gForm").onsubmit = async e => { e.preventDefault();
  if (await sha($("gPw").value) === GATE_HASH) { try { localStorage.setItem("pcg-mom-ok", JSON.stringify({ h: GATE_HASH, day: TODAY })); } catch (er) {} $("gate").hidden = true; }
  else { $("gErr").textContent = "รหัสไม่ถูกต้อง ลองอีกครั้ง"; $("gPw").select(); } };

/* ---------- ข้อมูล ---------- */
let DB = []; try { DB = clean(JSON.parse(localStorage.getItem(LSK) || "[]")); } catch (e) {}
let SBOK = null, CUR = null;
const sbH = x => Object.assign({ apikey: SBK, Authorization: "Bearer " + SBK, "Content-Type": "application/json" }, x || {});
const live = () => DB.filter(m => !m.del && !m.cfg).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.no || 0) - (a.no || 0));
const cur = () => DB.find(m => m.id === CUR);
function syncLabel() { const el = $("sync"); el.className = "sync" + (SBOK === false ? " bad" : "");
  el.textContent = SBOK === null ? "กำลังเชื่อมข้อมูล…" : SBOK ? "✓ เชื่อมทุกเครื่องแล้ว" : "⚠ ยังไม่เชื่อม: เก็บในเครื่องนี้"; }
async function sbAll() { const r = await fetch(SBU + TBL + "?select=id,rec", { headers: sbH() }); if (!r.ok) throw new Error(r.status); return (await r.json()).map(x => clean(x.rec)); }
async function sbUp(L) { const r = await fetch(SBU + TBL + "?on_conflict=id", { method: "POST", headers: sbH({ Prefer: "resolution=merge-duplicates,return=minimal" }),
  body: JSON.stringify(L.map(m => ({ id: m.id, rec: m, updated_at: nowIso() }))) }); if (!r.ok) throw new Error(r.status); }
function lsSave() { try { localStorage.setItem(LSK, JSON.stringify(DB)); } catch (e) {} }
const PEND = new Set();
function save(m, now) { m.u = nowIso(); lsSave(); PEND.add(m.id); clearTimeout(save.h); save.h = setTimeout(flush, now ? 0 : 700); }
async function flush() { const L = DB.filter(m => PEND.has(m.id)); PEND.clear(); if (!L.length || location.protocol === "file:") return;
  try { await sbUp(L); if (!SBOK) { SBOK = true; syncLabel(); } } catch (e) { SBOK = false; syncLabel(); L.forEach(m => PEND.add(m.id)); } }
async function sbSync() {
  if (location.protocol === "file:") { SBOK = false; syncLabel(); return; }
  try { const rem = await sbAll(), mp = new Map(DB.map(m => [m.id, m])), up = [];
    rem.forEach(r => { if (!r || typeof r.id !== "string") return; const l = mp.get(r.id); if (!l || (r.u || "") > (l.u || "")) mp.set(r.id, r); });
    DB.forEach(l => { const r = rem.find(x => x && x.id === l.id); if (!r || (l.u || "") > (r.u || "")) up.push(l); });
    DB = [...mp.values()]; lsSave(); if (up.length) await sbUp(up); SBOK = true;
  } catch (e) { SBOK = false; }
  syncLabel(); live().forEach(migrate); route();
}

/* ---------- รายชื่อบุคคล (แถว id CFG:people ในตาราง mom_meetings เดิม) ---------- */
function PR() { let p = DB.find(m => m.id === "CFG:people"); if (!p) { p = { id: "CFG:people", cfg: "people", list: [] }; DB.push(p); } if (!Array.isArray(p.list)) p.list = []; return p; }
const people = () => PR().list.filter(x => !x.del).sort((a, b) => (a.ord || 0) - (b.ord || 0) || a.name.localeCompare(b.name, "th"));
const pById = id => PR().list.find(x => x.id === id);
const bare = n => (n || "").replace(/^\s*(คุณ|k\.|K\.)\s*/, "").replace(/\s+/g, " ").trim();
const khun = n => /^(คุณ|นาย|นาง|น\.ส\.|k\.|mr|ms|dr)/i.test(n) ? n : "คุณ" + n;
function findOrAdd(name, pos) { const n = bare(name); if (!n) return null; const f = n.split(" ")[0];
  let p = people().find(x => bare(x.name) === n) || people().find(x => { const xf = bare(x.name).split(" ")[0]; return xf === f && (!n.includes(" ") || !x.name.includes(" ")); });
  if (p) { if (n.includes(" ") && !p.name.includes(" ")) p.name = n; return p.id; }
  p = { id: "P" + uid(), name: n, pos: pos || "", org: "PCG", ord: PR().list.length + 1 }; PR().list.push(p); save(PR()); return p.id; }
/* ข้อความผู้เข้าร่วมสำหรับรายงาน: PCG: คุณ…, คุณ… (แยกตามหน่วยงาน) */
function attText(m) { if (!Array.isArray(m.attIds)) return m.att || "";
  const g = {}; m.attIds.map(pById).filter(Boolean).forEach(p => (g[p.org || "PCG"] = g[p.org || "PCG"] || []).push(khun(p.name)));
  return Object.entries(g).map(([o, L]) => o + ": " + L.join(", ")).join("   "); }
const byText = m => { const p = m.byId && pById(m.byId); return p ? khun(p.name) : (m.by || ""); };
/* การประชุมเดิม (ข้อความ) → เลือกจากรายชื่อ */
function migrate(m) { if (Array.isArray(m.attIds)) return;
  const txt = (m.att || "").replace(/^[^:]*:/, ""); m.attIds = txt.split(/[,，]/).map(x => findOrAdd(x)).filter(Boolean);
  if (m.by && !m.byId) m.byId = findOrAdd(m.by); save(m); }

/* ---------- สร้างการประชุมใหม่: เติมจากครั้งก่อน + ยกงานที่ยังไม่เสร็จ ---------- */
function newMeeting() {
  const last = live()[0], d = new Date();
  if (last && last.date) { const n = new Date(last.date + "T00:00:00"); n.setDate(n.getDate() + 7); if (ymd(n) > ymd(d)) d.setTime(n.getTime()); }
  const m = { id: "M" + uid(), no: (last ? (+last.no || 0) : 0) + 1, date: ymd(d), attIds: last && last.attIds ? last.attIds.slice() : [], byId: last ? last.byId : "", att: "", by: "", place: last ? last.place : "WH05",
    t1: last ? last.t1 : "09:30", t2: last ? last.t2 : "11:30", notes: "", created: nowIso(),
    rows: last ? last.rows.filter(r => r.s !== "done").map(r => Object.assign({}, r, { id: "R" + uid(), carry: (+r.carry || 0) + 1, from: r.id })) : [] };
  DB.push(m); CUR = m.id; save(m, true); go("edit", m.id); toast(last ? "สร้าง W" + m.no + " แล้ว · ยกงานที่ยังไม่เสร็จมา " + m.rows.length + " งาน" : "สร้างการประชุมแล้ว");
}
$("newBtn").onclick = newMeeting;

/* ---------- แถบรายการ ---------- */
function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const L = live().filter(m => !q || [m.att, m.notes, ...m.rows.map(r => r.p + " " + r.t + " " + r.o)].join(" ").toLowerCase().includes(q));
  $("list").innerHTML = L.map(m => { const open = m.rows.filter(r => r.s !== "done").length;
    return `<button type="button" class="wk ${m.id === CUR ? "on" : ""}" data-m="${m.id}"><b>W${esc(m.no)} · ${esc(dShort(m.date))}</b><small>${m.rows.length} งาน · ค้าง ${open}${m.final ? " · ✓ ปิดบันทึก" : ' · <span class="dr">ร่าง</span>'}</small></button>`; }).join("")
    || `<div class="hint" style="padding:6px">${DB.length ? "ไม่พบ" : "ยังไม่มีบันทึก · กด \"ประชุมสัปดาห์ถัดไป\" หรือนำเข้าไฟล์ Word เดิม"}</div>`;
  const c = live()[0], open = c ? c.rows.filter(r => r.s !== "done") : [], old = open.filter(r => (+r.carry || 0) >= 2);

/* ---------- วางจาก Excel (คัดลอกแถวจาก Excel/ตาราง Word: หัวข้อ · งาน · ผู้รับผิดชอบ · กำหนดเสร็จ) ---------- */
const dlg = $("dlg"), dbox = $("dbox"); const closeDlg = () => dlg.hidden = true;

function parseDate(s) { s = (s || "").trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + "-" + pad(m[2]) + "-" + pad(m[3]);
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))) { let y = +m[3]; if (y < 100) y += 2000; if (y > 2400) y -= 543; return y + "-" + pad(m[2]) + "-" + pad(m[1]); }
  const i = TH_M.findIndex(x => s.includes(x)), j = i < 0 ? TH_S.findIndex(x => s.includes(x)) : i;
  if (j >= 0 && (m = s.match(/(\d{1,2})\D+(\d{4})/))) { let y = +m[2]; if (y > 2400) y -= 543; return y + "-" + pad(j + 1) + "-" + pad(m[1]); }
  return ""; }
const stOfTxt = s => /เสร็จ/.test(s) ? "done" : /กำลัง|ดำเนิน/.test(s) ? "prog" : "todo";

/* ---------- นำเข้าไฟล์ Word เดิม (.docx ตามแบบฟอร์ม Project Weekly) ---------- */
$("impFile").onchange = async e => { const fs = [...e.target.files]; e.target.value = ""; let n = 0, last = null;
  for (const f of fs) { try { const m = await readDocx(f); const dup = live().find(x => x.date === m.date);
      if (dup) { toast("มีการประชุมวันที่ " + dShort(m.date) + " อยู่แล้ว · ข้าม " + f.name); continue; }
      DB.push(m); migrate(m); save(m, true); n++; last = m; } catch (er) { toast("อ่าน " + f.name + " ไม่ได้: " + er.message); } }
  if (last) { CUR = last.id; render(); toast("นำเข้าแล้ว " + n + " ไฟล์ · เพิ่มชื่อผู้เข้าร่วมในรายชื่อบุคคลให้แล้ว (เติมตำแหน่งได้ที่ 👥)"); } };
async function readDocx(f) {
  const z = await JSZip.loadAsync(await f.arrayBuffer()), xml = await z.file("word/document.xml").async("string");
  const doc = new DOMParser().parseFromString(xml, "application/xml"), W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const txt = el => [...el.getElementsByTagNameNS(W, "p")].map(p => [...p.getElementsByTagNameNS(W, "t")].map(t => t.textContent).join("")).join(" ").replace(/\s+/g, " ").trim();
  const red = el => [...el.getElementsByTagNameNS(W, "color")].some(c => /^(EE0000|FF0000|C00000)$/i.test(c.getAttributeNS(W, "val") || ""));
  const tables = [...doc.getElementsByTagNameNS(W, "tbl")];
  const m = { id: "M" + uid(), no: 0, date: "", att: "", by: "", place: "", t1: "", t2: "", notes: "", rows: [], created: nowIso(), src: f.name, final: true };
  const toTime = s => { const x = (s || "").match(/(\d{1,2})[:.](\d{2})/); return x ? pad(x[1]) + ":" + x[2] : ""; };
  for (const tb of tables) {
    const rows = [...tb.getElementsByTagNameNS(W, "tr")].map(tr => [...tr.getElementsByTagNameNS(W, "tc")].map(tc => ({ t: txt(tc), red: red(tc) })));
    if (rows.some(r => r.some(c => /ผู้เข้าร่วมประชุม/.test(c.t)))) {
      rows.forEach(r => r.forEach((c, i) => { const v = (r[i + 1] || {}).t || "";
        if (/ผู้เข้าร่วมประชุม/.test(c.t)) m.att = v; else if (/ผู้จัดทำ/.test(c.t)) m.by = v; else if (/วันที่ประชุม/.test(c.t)) m.date = parseDate(v);
        else if (/สถานที่/.test(c.t)) m.place = v; else if (/เวลาเริ่ม/.test(c.t)) m.t1 = toTime(v); else if (/เวลาเลิก/.test(c.t)) m.t2 = toTime(v); }));
    } else if (rows.some(r => r.some(c => /หัวข้อโครงการ/.test(c.t)))) {
      let go = false;
      rows.forEach(r => { if (r.some(c => /หัวข้อโครงการ/.test(c.t))) { go = true; return; } if (!go || r.length < 4 || !r.some(c => c.t)) return;
        const end = r[3].t, d = parseDate(end);
        m.rows.push({ id: "R" + uid(), p: r[0].t, t: r[1].t, o: r[2].t, d, s: d ? "prog" : stOfTxt(end), red: r[1].red || r[2].red }); });
      const dd = rows.map(r => r.map(c => c.t).join(" ")).find(s => /ประจำวันที่/.test(s)); if (!m.date && dd) m.date = parseDate(dd.replace(/.*ประจำวันที่/, ""));
    }
  }
  const wn = f.name.match(/W\s*(\d+)/i); m.no = wn ? +wn[1] : 0;
  if (!m.date) { const fd = f.name.match(/(\d{4})-(\d{2})-(\d{2})/); m.date = fd ? fd[0] : TODAY; }
  if (!m.rows.length && !m.att) throw new Error("ไม่พบตารางแบบฟอร์ม Project Weekly");
  return clean(m);
}

  const head = new D.Table({ width: { size: W, type: D.WidthType.DXA }, columnWidths: [2899, 2353, 1767, 2053], rows: [
    new D.TableRow({ children: [cell("บันทึกการประชุม  Project Weekly", { span: 4, b: true, center: true })] }),
    new D.TableRow({ children: [cell("ผู้เข้าร่วมประชุม", { b: true, w: 2899 }), cell(attText(m), { span: 3 })] }),
    new D.TableRow({ children: [cell("ผู้จัดทำบันทึกการประชุม", { b: true }), cell(byText(m), { span: 3 })] }),
    new D.TableRow({ children: [cell("วันที่ประชุม", { b: true }), cell(dLong(m.date)), cell("สถานที่ประชุม", { b: true }), cell(m.place)] }),
    new D.TableRow({ children: [cell("เวลาเริ่มประชุม", { b: true }), cell(tm(m.t1)), cell("เวลาเลิกประชุม", { b: true }), cell(tm(m.t2))] }) ] });
  const nv = (t, o) => cell(t, Object.assign({ fill: "002060", color: "FFFFFF", center: true }, o || {}));
  const body = new D.Table({ width: { size: W, type: D.WidthType.DXA }, columnWidths: [1745, 4100, 1667, 1560], rows: [
    new D.TableRow({ children: [nv("ประจำวันที่ " + dLong(m.date), { span: 4, size: 28 })] }),
    new D.TableRow({ tableHeader: true, children: [nv("หัวข้อโครงการ"), nv("งานที่ต้องทำ (Task)"), nv("ผู้รับผิดชอบ"), nv("กำหนดเสร็จ")] }),
    ...m.rows.map(r => { const c = r.red ? "EE0000" : "000000";
      return new D.TableRow({ children: [cell(r.p, { size: 28, color: c }), cell(r.t, { color: c }), cell(r.o, { color: c }),
        cell(endTxt(r), { color: c, center: true, fill: r.s === "done" ? "00B050" : r.s === "prog" ? "FFFF00" : undefined })] }); }) ] });
  const logo = Uint8Array.from(atob(LOGO), ch => ch.charCodeAt(0));
  const doc = new D.Document({ sections: [{
    properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 1134, right: 1416, bottom: 993, left: 1418, header: 708, footer: 708 } } },
    headers: { default: new D.Header({ children: [new D.Paragraph({ children: [new D.ImageRun({ data: logo, transformation: { width: 144, height: 76 } })] })] }) },
    children: [head, new D.Paragraph({ spacing: { before: 240, after: 120 }, children: [run("สรุปประเด็นสำคัญจากการประชุม", { bold: true })] }), body] }] });
  const blob = await D.Packer.toBlob(doc), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = m.date + "_Minute_meeting_Project_Weekly_W" + (m.no || "") + ".docx";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("ดาวน์โหลด Word แล้ว");
}

/* ---------- ส่ง Task เข้า Daily Task (ตาราง daily_tasks · ปุ่มกดเอง ตรวจก่อนส่ง) ---------- */
const TEAM0 = [{ k: "ton", n: "ตั๋น", sub: "K.ศุภณัฐ", own: "K.ศุภณัฐ" }, { k: "mink", n: "Mink", sub: "มิ้งค์", own: "Mink" }];
const norm = s => (s || "").toLowerCase().trim().replace(/^(พี่|น้อง|คุณ|k\.)\s*/, "").replace(/ค์$/, "").replace(/[่้๊๋์]/g, "").trim();
function boardOf(owner, team) { const toks = (owner || "").split(/[,/&]| และ /).map(norm).filter(Boolean);
  for (const t of toks) for (const b of team) { const ns = [b.n, b.sub, b.own].map(norm).filter(Boolean); if (ns.some(n => n.includes(t) || t.includes(n))) return b.k; }
  return team[0].k; }
async function taskDlg(m) {
  if (location.protocol === "file:") { toast("ต้องเปิดจากเว็บจริงถึงจะส่งได้"); return; }
  const L = m.rows.filter(r => r.s !== "done" && !r.task && (r.t || r.p));
  if (!L.length) { toast("ไม่มีงานที่ต้องส่ง (ส่งเฉพาะงานที่ยังไม่เสร็จและยังไม่เคยส่ง)"); return; }
  let team = TEAM0, nos = {};
  try { const r = await fetch(SBU + "daily_tasks?select=id,bd:rec->>bd,no:rec->>no,members:rec->members&id=not.like.FILE:*", { headers: sbH() }); if (!r.ok) throw new Error(r.status);
    const a = await r.json(); const tm = a.find(x => x.id === "CFG:team"); if (tm && Array.isArray(tm.members) && tm.members.length) team = clean(tm.members);
    a.forEach(x => { if (x.bd !== undefined && x.no) { const b = x.bd || "ton"; nos[b] = Math.max(nos[b] || 0, +x.no || 0); } });
  } catch (e) { toast("เชื่อม Daily Task ไม่ได้: " + e.message); return; }
  dbox.innerHTML = `<h3>ส่ง Task เข้า Daily Task</h3><div class="hint">ส่งเฉพาะงานที่ยังไม่เสร็จและยังไม่เคยส่ง · เลือกบอร์ด (คน) ได้ · ส่งแล้วแก้ต่อที่หน้า Daily Task</div>
    <div style="overflow-x:auto"><table><thead><tr><th><input type="checkbox" id="tAll" checked aria-label="เลือกทั้งหมด"></th><th>งาน</th><th>ผู้รับผิดชอบ</th><th>Target</th><th>บอร์ด</th></tr></thead><tbody>
    ${L.map((r, i) => `<tr><td><input type="checkbox" data-ti="${i}" checked aria-label="เลือก"></td><td><b>${esc(r.p)}</b><br>${esc(r.t)}</td><td>${esc(r.o)}</td><td>${esc(r.d ? dShort(r.d) : "–")}</td>
      <td><select data-tb="${i}" aria-label="บอร์ด">${team.map(b => `<option value="${esc(b.k)}" ${b.k === boardOf(r.o, team) ? "selected" : ""}>${esc(b.n)}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>
    <div class="ft"><span class="sp hint">ความคืบหน้าเริ่มต้น: ยังไม่เริ่ม 0% · กำลังดำเนินการ 25%</span><button type="button" class="gbtn" data-x="1">ยกเลิก</button><button type="button" class="pbtn" id="tOk">ส่ง</button></div>`;
  dlg.hidden = false;
  $("tAll").onchange = e => dbox.querySelectorAll("[data-ti]").forEach(c => c.checked = e.target.checked);
  $("tOk").onclick = async () => {
    const at = nowIso(), out = [];
    dbox.querySelectorAll("[data-ti]:checked").forEach(c => { const i = +c.dataset.ti, r = L[i], bd = dbox.querySelector(`[data-tb="${i}"]`).value;
      nos[bd] = (nos[bd] || 0) + 1; const prog = r.s === "prog" ? 25 : 0, id = "MOM-" + r.id;
      out.push({ r, t: { id, bd, no: nos[bd], title: clean((r.p ? r.p + " · " : "") + r.t), owner: clean(r.o), pri: "M", start: m.date, target: r.d || "", prog,
        note: "จากบันทึกการประชุม Project Weekly W" + m.no + " (" + dShort(m.date) + ")", created: at, u: at, by: "MoM", hist: [{ at, from: null, p: prog, by: "MoM" }] } }); });
    if (!out.length) { closeDlg(); return; }
    try { const r = await fetch(SBU + "daily_tasks?on_conflict=id", { method: "POST", headers: sbH({ Prefer: "resolution=ignore-duplicates,return=minimal" }),
        body: JSON.stringify(out.map(x => ({ id: x.t.id, rec: x.t, updated_at: at }))) }); if (!r.ok) throw new Error(r.status);
      out.forEach(x => x.r.task = x.t.id); save(m, true); closeDlg(); render(); toast("ส่งเข้า Daily Task แล้ว " + out.length + " งาน");
    } catch (e) { toast("ส่งไม่สำเร็จ: " + e.message); } };
}

syncLabel(); route(); sbSync();   /* migrate หลังซิงก์ (กันรายชื่อบุคคลในเครื่องทับของเครื่องอื่น) */
addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !PEND.size && !document.activeElement.matches("input,textarea,select")) sbSync(); });
addEventListener("beforeunload", () => { if (PEND.size) flush(); });
</script>
