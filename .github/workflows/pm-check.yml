name: PM Supabase check  # postpone2
on:
  push:
    branches: [claude/wonderful-ride-myzde3]
    paths: [.github/workflows/pm-check.yml]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbnNob3ZuaWJjbWlwdG94ZGZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNzI1NDIsImV4cCI6MjEwNDk0ODU0Mn0.UoPu-i6ODMEgyuqoO6oKHf0JIqFKpWkSpBkOKrpITwQ"
          U="https://mgnshovnibcmiptoxdfe.supabase.co/rest/v1"
          echo "[]" > all.json
          for o in 0 1000 2000 3000; do curl -s "$U/pm_work_orders?select=rec&order=id&limit=1000&offset=$o" -H "apikey: $K" -H "Authorization: Bearer $K" > p.json; jq -s '.[0]+.[1]' all.json p.json > t.json && mv t.json all.json; done
          echo "== rows: $(jq length all.json)"
          echo "== statuses"; jq -r '.[].rec.s' all.json | sort | uniq -c
          echo "== keys"; jq -r '.[0].rec|keys|join(",")' all.json
          echo "== postponed sample"; jq -c '[.[].rec|select(.s|test("เลื่อน"))][:15][]' all.json
          echo "== postponed count by branch"; jq -r '.[].rec|select(.s|test("เลื่อน"))|.b' all.json | sort | uniq -c
          echo "== due>asof not done (sample)"; jq -c '[.[].rec|select(.s!="เสร็จสิ้น" and .s!="ยกเลิกงาน" and .s!="รอสร้างใบงาน")|{s,due,done,b,w}]|sort_by(.due)|.[:5]' all.json
          echo "== upload log"; curl -s "$U/pm_upload_log?select=rec&order=updated_at.desc&limit=3" -H "apikey: $K" -H "Authorization: Bearer $K" | head -c 1500
