name: PM Supabase check  # security
on:
  push:
    branches: [claude/wonderful-ride-myzde3]
    paths: [.github/workflows/pm-check.yml]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbnNob3ZuaWJjbWlwdG94ZGZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNzI1NDIsImV4cCI6MjEwNDk0ODU0Mn0.UoPu-i6ODMEgyuqoO6oKHf0JIqFKpWkSpBkOKrpITwQ"
          U="https://mgnshovnibcmiptoxdfe.supabase.co/rest/v1"
          for t in cm_work_orders cm_upload_log robot_loads robot_entries robot_days warehouses mhe_vehicles shift_edits pm_work_orders pm_fail_followup pm_upload_log iot_devices iot_readings iot_device_meta iot_commands machine_checks machine_daily_audit; do
            r=$(curl -s -o /dev/null -w "%{http_code}" -D h.txt "$U/$t?select=*&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Prefer: count=exact")
            echo "$t | http=$r | $(grep -i content-range h.txt | tr -d '\r')"
          done
          echo "== robot.csv ขนาดตู้ 14/10 (เฉพาะคอลัมน์ วันที่/ตู้/สายส่ง/พาเลท/ขนาด)"
          curl -sL "https://dl.dropboxusercontent.com/scl/fi/ne9lil4vs5ds1kvodrqjv/robot.csv?rlkey=jyfr275jx5f2bb4swgj9kms03" -o r.csv
          python3 - <<'PY'
          import csv,io
          t=open('r.csv',encoding='utf-8-sig',errors='replace').read(); rows=list(csv.reader(io.StringIO(t)))
          h=[x.replace(' ','').lower() for x in rows[0]]; print('HEAD',rows[0])
          def ix(*n):
            for k in n:
              k=k.replace(' ','').lower()
              if k in h: return h.index(k)
            return -1
          d,c,sp,pl,sz=ix('วันที่โหลด','date'),ix('ตู้ที่','container'),ix('สายส่ง'),ix('จำนวนพาเลท'),ix('ขนาด','ขนาดตู้','size','size_ft')
          print('idx',d,c,sp,pl,sz)
          agg={}
          for r in rows[1:]:
            if len(r)<=max(d,c,sp,pl): continue
            if not (r[d].startswith('14/10') or r[d].startswith('2026-10-14') or r[d].strip() in ('46309',)): continue
            k=(r[c],r[sp]); a=agg.setdefault(k,[0,set()]); 
            try: a[0]+=float(r[pl] or 0)
            except: pass
            if sz>=0: a[1].add(r[sz])
          for k,v in agg.items(): print(k,'pallets',round(v[0],1),'size',v[1])
          PY
          echo "== robot_entries columns"; curl -s "$U/robot_entries?select=*&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K" | jq -c ".[0] | keys"
          echo "== iot_devices (ชื่อ/หมวด/คลัง)"; curl -s "$U/iot_devices?select=name,category,site,online&order=category" -H "apikey: $K" -H "Authorization: Bearer $K" | jq -r '.[] | "\(.category) | \(.site) | \(.online) | \(.name)"'
          echo "== ค่าล่าสุดของ FAN (dlq)"; for n in WH5-Fan1 WH5-Fan4 WH8-FAN1 WH8-FAN3; do id=$(curl -s "$U/iot_devices?select=id&name=eq.$n" -H "apikey: $K" -H "Authorization: Bearer $K" | jq -r '.[0].id'); echo "$n $(curl -s "$U/iot_readings?select=ts,power_w,switch_on&device_id=eq.$id&order=ts.desc&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K")"; done
          echo "== mhe FILE rows (ไฟล์แนบ)"; curl -s "$U/mhe_vehicles?select=id&id=like.FILE:*" -H "apikey: $K" -H "Authorization: Bearer $K" | jq length
          echo "== storage buckets (anon)"; curl -s "https://mgnshovnibcmiptoxdfe.supabase.co/storage/v1/bucket" -H "apikey: $K" -H "Authorization: Bearer $K" | head -c 300; echo
          echo "== auth signup enabled?"; curl -s "https://mgnshovnibcmiptoxdfe.supabase.co/auth/v1/settings" -H "apikey: $K" | jq -c '{disable_signup, mailer_autoconfirm, external: (.external|with_entries(select(.value==true))|keys)}'
          echo "== edge function iot-control"; curl -s -o /dev/null -w "%{http_code}\n" -X OPTIONS "https://mgnshovnibcmiptoxdfe.supabase.co/functions/v1/iot-control"
