name: PM Supabase check  # security
on:
  push:
    branches: [claude/wonderful-ride-myzde3]
    paths: [.github/workflows/pm-check.yml]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbnNob3ZuaWJjbWlwdG94ZGZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNzI1NDIsImV4cCI6MjEwNDk0ODU0Mn0.UoPu-i6ODMEgyuqoO6oKHf0JIqFKpWkSpBkOKrpITwQ"
          U="https://mgnshovnibcmiptoxdfe.supabase.co/rest/v1"; H=(-H "apikey: $K" -H "Authorization: Bearer $K")
          curl -s "$U/" "${H[@]}" > api.json
          T=$(jq -r '.definitions|keys[]' api.json)
          echo "== tables exposed to anon: $(echo $T)"
          for t in $T; do
            c=$(curl -s -o /dev/null -D - "$U/$t?select=*&limit=1" "${H[@]}" -H "Prefer: count=exact" | grep -i content-range | tr -d '\r' | awk '{print $2}')
            ins=$(curl -s -X POST "$U/$t" "${H[@]}" -H "Content-Type: application/json" -H "Prefer: return=minimal" -d '{}' | jq -r '.code // "OK?"')
            echo "$t | rows(range)=$c | insert-probe=$ins"
          done
          echo "== rpc functions"; jq -r '.paths|keys[]' api.json | grep rpc || true
