<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>งานที่ต้องทำประจำวันแผนกโครงการ · PCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Prompt:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef7f2; --card: #fff; --ink: #0f241c; --ink2: #35524a; --mut: #6b8a80; --line: #d9ebe2;
    --acc: #047857; --acc2: #064e3b; --tint: #e3f6ec;
    --done: #0f9a6e; --wait: #d97706; --prog: #2563eb; --delay: #dc2626; --cancel: #a3acbd;
    --r: 22px; --sh: 0 10px 30px -14px rgba(60, 30, 140, .28);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Anuphan", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 22px 60px; }
  header.top { background: linear-gradient(120deg, #064e3b 0%, #047857 55%, #2dd4bf 100%); color: #fff; border-radius: 0 0 34px 34px; padding: 22px 0 26px; margin-bottom: 18px; box-shadow: var(--sh); position: relative; overflow: hidden; }
  header.top::after { content: ""; position: absolute; right: -80px; top: -120px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%); }
  .hrow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: relative; z-index: 1; }
  .home { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff; text-decoration: none; font-weight: 700; border: 1px solid rgba(255,255,255,.25); }
  .logo { width: 54px; height: 54px; border-radius: 16px; background: #fff; display: grid; place-items: center; box-shadow: 0 8px 20px -8px rgba(0,0,0,.35); }
  .ttl small { display: block; font-size: 12px; letter-spacing: .12em; opacity: .8; font-weight: 600; }
  .ttl h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.15; font-family: "Plus Jakarta Sans", "Anuphan", "Anuphan"; }
  .ttl .sub { font-size: 13px; opacity: .85; margin-top: 4px; }
  .hbtns { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { border: 0; border-radius: 14px; padding: 11px 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; background: var(--card); color: var(--acc2); box-shadow: 0 6px 16px -10px rgba(6,60,45,.5); }
  .btn.pri { background: linear-gradient(135deg, #059669, #064e3b); color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.3); box-shadow: none; }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn.line { background: #fff; border: 1px solid var(--line); box-shadow: none; color: var(--ink2); }
  .btn.red { background: #fde8e8; color: #a51d1d; box-shadow: none; }
  .sync { font-size: 12px; opacity: .9; }
  nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  nav.tabs button { border: 0; background: #fff; border-radius: 14px; padding: 11px 18px; font-weight: 700; color: var(--ink2); display: inline-flex; gap: 8px; align-items: center; box-shadow: 0 4px 12px -8px rgba(6,60,45,.35); }
  nav.tabs button.on { background: var(--ink); color: #fff; }
  nav.tabs .cnt { background: #fde2e2; color: #a51d1d; border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: #fff; border-radius: 18px; padding: 10px 12px; margin-bottom: 16px; box-shadow: 0 4px 14px -10px rgba(6,60,45,.3); }
  .filters label { font-size: 13px; color: var(--mut); display: inline-flex; gap: 6px; align-items: center; }
  .filters select, .filters input[type=search] { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; min-width: 120px; }
  .filters input[type=search] { min-width: 220px; flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .grid { display: grid; gap: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 16px; }
  .kpi { background: #fff; border-radius: var(--r); padding: 16px 18px; box-shadow: var(--sh); border: 0; text-align: left; position: relative; overflow: hidden; }
  .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c, var(--acc)); }
  .kpi .l { font-size: 13px; color: var(--ink2); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .kpi .l svg { color: var(--c, var(--acc)); }
  .kpi .v { font-family: "Plus Jakarta Sans", "Anuphan", sans-serif; font-size: 38px; font-weight: 800; line-height: 1.1; margin-top: 6px; }
  .kpi .v small { font-size: 15px; font-family: "Anuphan"; color: var(--mut); font-weight: 600; margin-left: 4px; }
  .kpi .d { font-size: 12px; color: var(--mut); margin-top: 2px; }
  .kpi.sel { outline: 3px solid var(--c, var(--acc)); }
  .panel { background: #fff; border-radius: var(--r); padding: 18px 20px; box-shadow: var(--sh); min-width: 0; }
  .panel h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .panel .hint { margin: 4px 0 12px; font-size: 13px; color: var(--mut); }
  .tag { font-size: 12px; background: var(--tint); color: var(--acc2); padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  .g2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  /* แท่งรายเดือน */
  .mchart { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(34px, 1fr); align-items: end; gap: 8px; height: 230px; padding: 22px 4px 0; border-bottom: 1px solid var(--line); }
  .mcol { display: flex; flex-direction: column-reverse; gap: 2px; height: 100%; justify-content: flex-start; align-items: center; position: relative; cursor: pointer; }
  .mcol .seg { width: min(42px, 100%); }
  .mcol .seg:last-child { border-radius: 4px 4px 0 0; }
  .mcol .tot { position: absolute; font-size: 12px; font-weight: 700; color: var(--ink2); }
  .mcol:hover .seg { filter: brightness(1.08); }
  .mlab { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(34px, 1fr); gap: 8px; font-size: 12px; color: var(--mut); text-align: center; padding: 6px 4px 0; }
  .tip { position: fixed; z-index: 50; background: #0f241c; color: #fff; padding: 9px 12px; border-radius: 12px; font-size: 13px; pointer-events: none; box-shadow: 0 10px 24px -10px rgba(0,0,0,.5); display: none; min-width: 150px; }
  .tip b { display: block; margin-bottom: 4px; }
  .tip div { display: flex; justify-content: space-between; gap: 14px; }
  .tip i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 6px; }
  /* แถบสัดส่วน */
  .sbar { display: flex; gap: 2px; height: 16px; border-radius: 8px; overflow: hidden; background: #f1f0f7; }
  .sbar span { display: block; }
  .rows { display: grid; gap: 8px; }
  .irow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: #f6fbf8; border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
  .irow:hover { border-color: #c9bdf3; }
  .irow .t { font-weight: 600; font-size: 14px; }
  .irow .m { font-size: 12px; color: var(--mut); }
  .badge { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 11px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; }
  .prio { font-size: 12px; font-weight: 700; border-radius: 8px; padding: 2px 8px; }
  .prio.H { background: #fde8e8; color: #a51d1d; } .prio.M { background: #fff3db; color: #8a5300; } .prio.L { background: #e8f1ff; color: #1e4fb0; }
  .pbar { height: 8px; border-radius: 6px; background: #e2f1e9; overflow: hidden; min-width: 70px; }
  .pbar span { display: block; height: 100%; border-radius: 6px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: #fff; background: #065f46; padding: 11px 10px; font-weight: 600; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
  th:first-child { border-radius: 12px 0 0 0; } th:last-child { border-radius: 0 12px 0 0; }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.r { cursor: pointer; } tr.r:hover td { background: #faf8ff; }
  tr.kid td { background: #fbfaff; } tr.kid td.tt { padding-left: 34px; }
  tr.cx td { opacity: .55; }
  .tbl { overflow: auto; max-height: 72vh; border-radius: 12px; }
  .tog { border: 0; background: var(--tint); color: var(--acc2); border-radius: 8px; width: 24px; height: 24px; margin-right: 6px; font-weight: 800; }
  .num { font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--mut); padding: 28px; }
  /* Timeline */
  .tl { overflow: auto; max-height: 76vh; border: 1px solid var(--line); border-radius: 14px; }
  .tlg { display: grid; min-width: 1100px; position: relative; }
  .tlh { position: sticky; top: 0; z-index: 3; display: grid; background: #065f46; color: #fff; font-size: 12px; }
  .tlh div { padding: 9px 6px; border-left: 1px solid rgba(255,255,255,.12); text-align: center; }
  .tlh div:first-child { text-align: left; position: sticky; left: 0; background: #065f46; z-index: 4; border: 0; padding-left: 12px; }
  .tlr { display: grid; align-items: center; border-bottom: 1px solid var(--line); min-height: 40px; }
  .tlr .nm { position: sticky; left: 0; background: #fff; z-index: 2; padding: 7px 12px; font-size: 13px; border-right: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; height: 100%; display: flex; align-items: center; gap: 6px; }
  .tlr.kid .nm { padding-left: 30px; color: var(--ink2); }
  .tlr .lane { position: relative; height: 40px; grid-column: 2 / -1; }
  .tlr .bar { position: absolute; top: 11px; height: 18px; border-radius: 6px; overflow: hidden; cursor: pointer; min-width: 6px; }
  .tlr .bar span { position: absolute; left: 0; top: 0; bottom: 0; }
  .tlr .bar em { position: absolute; left: 6px; top: 1px; font-size: 11px; font-style: normal; color: #fff; font-weight: 700; white-space: nowrap; }
  .today { position: absolute; top: 0; bottom: 0; width: 2px; background: #e11d48; z-index: 1; pointer-events: none; }
  .today b { position: absolute; top: 2px; left: 4px; font-size: 11px; color: #e11d48; white-space: nowrap; }
  .mgrid { position: absolute; top: 0; bottom: 0; width: 1px; background: #f0eef8; }
  /* KPI ผู้รับผิดชอบ */
  .owners { align-items: start; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  .own { background: #fff; border-radius: var(--r); padding: 18px; box-shadow: var(--sh); display: grid; gap: 14px; }
  .own .hd { display: flex; gap: 14px; align-items: center; }
  .av { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #2dd4bf, #064e3b); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
  .own .nm { font-size: 18px; font-weight: 700; }
  .ring { margin-left: auto; position: relative; width: 84px; height: 84px; flex: none; }
  .ring b { position: absolute; inset: -10px 0 0; display: grid; place-items: center; font-family: "Plus Jakarta Sans", "Anuphan"; font-size: 22px; }
  .ring small { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--mut); }
  .mets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .met { background: #f6fbf8; border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; }
  .met b { display: block; font-family: "Plus Jakarta Sans", "Anuphan"; font-size: 20px; }
  .met span { font-size: 12px; color: var(--mut); }
  .grade { font-weight: 800; border-radius: 10px; padding: 3px 10px; font-size: 14px; }
  /* dialog */
  dialog { border: 0; border-radius: 22px; padding: 0; width: min(720px, 94vw); box-shadow: 0 30px 80px -20px rgba(20,0,60,.5); }
  dialog::backdrop { background: rgba(25,10,60,.45); }
  .dh { padding: 18px 22px; background: linear-gradient(120deg, #064e3b, #059669); color: #fff; display: flex; align-items: center; gap: 10px; }
  .dh h3 { margin: 0; font-size: 18px; flex: 1; }
  .dh button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 10px; width: 34px; height: 34px; font-size: 18px; }
  .db { padding: 18px 22px; display: grid; gap: 12px; max-height: 70vh; overflow: auto; }
  .fr { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fl { display: grid; gap: 5px; font-size: 13px; color: var(--ink2); font-weight: 600; }
  .fl input, .fl select, .fl textarea { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-weight: 500; color: var(--ink); background: #fff; }
  .fl textarea { min-height: 70px; resize: vertical; }
  .df { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .pq { display: flex; gap: 6px; flex-wrap: wrap; }
  .pq button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: 13px; }
  .pq button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  .note { font-size: 13px; background: #fff7e6; border: 1px solid #fde3a7; color: #7a4a00; border-radius: 12px; padding: 10px 12px; }
  .ok { font-size: 13px; background: #e8f8f1; border: 1px solid #bfe9d5; color: #0b6b4c; border-radius: 12px; padding: 10px 12px; }
  .hist { font-size: 12px; color: var(--mut); display: grid; gap: 3px; }
  .guide h4 { margin: 10px 0 4px; }
  .guide p, .guide li { font-size: 14px; color: var(--ink2); line-height: 1.6; }
  .ci { border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 7px; font-size: 13.5px; width: 100%; min-width: 0; color: var(--ink); }
  .ci:hover { border-color: var(--line); background: #fff; } .ci:focus { outline: 0; border-color: #34d399; background: #fff; box-shadow: 0 0 0 3px #d1fae5; }
  input.ci[type=date] { width: 132px; } select.ci { width: auto; cursor: pointer; } .ci.cp { font-weight: 700; }
  .sheet td { padding: 6px 6px; } .sheet td.tt .ci { font-weight: 600; }
  tr.add td { background: #ecfdf5; border-bottom: 2px solid #bbf7d0; position: sticky; top: 41px; z-index: 1; } tr.add .ci { background: #fff; border-color: #bbf7d0; }
  .saved { outline: 2px solid #34d399 !important; transition: outline .6s; }
  /* แถบซ้าย: แยกงานรายคน (15 ต.ค.) */
  .lay { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; align-items: start; }
  .side { position: sticky; top: 14px; display: grid; gap: 10px; background: #fff; border-radius: var(--r); padding: 14px; box-shadow: var(--sh); }
  .side h4 { margin: 2px 4px 2px; font-size: 12px; letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
  .pb { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; border: 1px solid var(--line); background: #f6fbf8; border-radius: 16px; padding: 12px; text-align: left; width: 100%; }
  .pb .av { width: 42px; height: 42px; font-size: 16px; }
  .pb b { display: block; font-size: 16px; }
  .pb small { display: block; font-size: 12px; color: var(--mut); margin-top: 2px; }
  .pb .mini { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pb .mini span { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: #fff; border: 1px solid var(--line); }
  .pb.on { background: linear-gradient(135deg, #047857, #064e3b); border-color: transparent; color: #fff; box-shadow: 0 10px 22px -12px rgba(6,78,59,.8); }
  .pb.on small { color: rgba(255,255,255,.8); } .pb.on .mini span { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.25); color: #fff; }
  .pb.on .av { background: #fff; color: #064e3b; }
  @media (max-width: 1000px) { .lay { grid-template-columns: 1fr; } .side { position: static; grid-template-columns: repeat(2, 1fr); } .side h4 { grid-column: 1 / -1; } }
  @media (max-width: 1200px) { .kpis { grid-template-columns: repeat(3, 1fr); } .g2, .g3 { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .wrap { padding: 0 12px 50px; } .kpis { grid-template-columns: repeat(2, 1fr); } .ttl h1 { font-size: 22px; } .fr { grid-template-columns: 1fr; } .hbtns { margin-left: 0; } .owners { grid-template-columns: 1fr; } .mets { grid-template-columns: repeat(2, 1fr); } .kpi .v { font-size: 30px; } }
  /* ===== Digital Twin / Mission Control (16 ต.ค. ผู้ใช้ขอ: สวยและ Digital twin กว่านี้) · body.dt = ธีมมืด (ค่าเริ่ม) · ปุ่มสลับแบบสว่างที่หัว ===== */
  .clock { font-family: "Plus Jakarta Sans", "Anuphan", monospace; font-variant-numeric: tabular-nums; font-size: 13px; letter-spacing: .06em; opacity: .9; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: .14em; color: #34d399; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .mc { display: grid; grid-template-columns: 300px 1fr 260px; gap: 16px; margin-bottom: 16px; }
  .mc .panel { position: relative; overflow: hidden; min-width: 0; } .g2 > * { min-width: 0; }
  .hring { display: grid; place-items: center; position: relative; padding: 6px 0; }
  .hring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .hring .c b { font-family: "Plus Jakarta Sans", "Anuphan"; font-size: 36px; line-height: 1; }
  .hring .c span { font-size: 11px; color: var(--mut); letter-spacing: .08em; }
  .pipe { display: grid; grid-template-columns: 1fr 70px 1fr 70px 1fr; align-items: center; gap: 0; padding: 18px 6px 4px; }
  .node { text-align: center; display: grid; justify-items: center; gap: 6px; cursor: pointer; border: 0; background: none; padding: 0; }
  .node .o { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font-family: "Plus Jakarta Sans", "Anuphan"; font-size: 30px; font-weight: 800; color: var(--ink); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--nc) 38%, transparent), color-mix(in srgb, var(--nc) 10%, transparent) 70%); border: 2px solid var(--nc); box-shadow: 0 0 0 6px color-mix(in srgb, var(--nc) 12%, transparent), 0 0 26px color-mix(in srgb, var(--nc) 55%, transparent); transition: transform .2s; }
  .node:hover .o { transform: scale(1.06); }
  .node b { font-size: 13px; } .node small { font-size: 11px; color: var(--mut); }
  .wire { height: 3px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--a) 70%, transparent), color-mix(in srgb, var(--b) 70%, transparent)); position: relative; overflow: hidden; }
  .wire::after { content: ""; position: absolute; top: -2px; width: 18px; height: 7px; border-radius: 7px; background: #fff; box-shadow: 0 0 10px #fff, 0 0 18px var(--b); animation: flow 1.8s linear infinite; }
  @keyframes flow { from { left: -20px; } to { left: 100%; } }
  .pipe2 { display: grid; grid-template-columns: 1fr 70px 1fr 70px 1fr; }
  .drop { grid-column: 3; display: grid; justify-items: center; }
  .drop .v { width: 3px; height: 26px; background: linear-gradient(180deg, color-mix(in srgb, var(--prog) 70%, transparent), color-mix(in srgb, var(--delay) 80%, transparent)); }
  .stack { display: grid; gap: 10px; }
  .pls { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card2); }
  .pls b { font-family: "Plus Jakarta Sans", "Anuphan"; font-size: 22px; }

function heatmap(L) {

  L.filter(t => t.target && t.target.startsWith(y) && stOf(t) !== "cancel").forEach(t => { const v = by[t.target] = by[t.target] || { n: 0, d: 0, ok: 0 }; v.n++; if (stOf(t) === "delay") v.d++; if (stOf(t) === "done") v.ok++; });
  const start = new Date(d0); start.setUTCDate(start.getUTCDate() - start.getUTCDay());
  const cells = [], labs = []; let lastM = -1;
  for (let d = new Date(start), w = 0; d.getUTCFullYear() <= +y; w++) {
    for (let k = 0; k < 7; k++, d.setUTCDate(d.getUTCDate() + 1)) {
      const iso = d.toISOString().slice(0, 10), v = by[iso], inY = iso.startsWith(y);
      if (k === 0) { const m = d.getUTCMonth(); labs.push(m !== lastM && inY ? TH_M[m] : ""); if (inY) lastM = m; }

/* ข้อ 9: ไฟล์แนบ เก็บเป็นแถว id FILE:<สุ่ม> ในตาราง daily_tasks เดิม (ไม่โหลดตอนเปิดหน้า · โหลดเมื่อกด) */

/* ---------- KPI ผู้รับผิดชอบ ---------- */
/* คะแนน = 40% อัตราสำเร็จ + 40% ส่งตรงเวลา + 20% งานค้างไม่ Delay */
function kpiOf(o) {
  const L = live().filter(t => !t.parent && t.owner === o), c = stat(L), open = c.prog + c.delay + c.wait;
  const noDelay = open ? (1 - c.delay / open) : 1, onR = c.done ? c.onT / c.done : 1;
  const score = c.n ? Math.round((0.4 * c.done / c.n + 0.4 * onR + 0.2 * noDelay) * 100) : 0;
  const lates = L.filter(t => stOf(t) === "delay"), avgLate = lates.length ? Math.round(lates.reduce((a, t) => a + lateDays(t), 0) / lates.length) : 0;
  const openL = L.filter(t => ["prog", "delay", "wait"].includes(stOf(t))), avgP = openL.length ? Math.round(openL.reduce((a, t) => a + progOf(t), 0) / openL.length) : 0;
  const dur = L.filter(t => stOf(t) === "done" && t.start && (t.doneAt || t.target)).map(t => Math.max(1, days(t.start, t.doneAt || t.target) + 1));
  return { c, score, grade: score >= 90 ? "A" : score >= 80 ? "B" : score >= 70 ? "C" : "D", noDelay: Math.round(noDelay * 100), onR: Math.round(onR * 100), avgLate, avgP, open: openL.length, lates, avgDur: dur.length ? Math.round(dur.reduce((a, b) => a + b, 0) / dur.length) : 0 };
}
const gradeCol = s => { const k = s >= 90 ? "done" : s >= 80 ? "prog" : s >= 70 ? "wait" : "delay"; return [ST[k].fg, ST[k].bg]; };

      <div class="sbar">${ORDER.filter(s => c[s]).map(s => `<span style="flex:${c[s]};background:${ST[s].c}" title="${ST[s].t} ${c[s]}"></span>`).join("")}</div>
      <div class="mets">

      ${plan.upd.length ? `<div class="hist">${plan.upd.slice(0, 40).map(x => `<div><b>#${esc(x.o.no)} ${esc(x.o.title)}</b> · ${x.ch.map(k => k + ": " + esc(x.o[k] == null ? "–" : x.o[k]) + " → " + esc(x.r[k] == null ? "–" : x.r[k])).join(" · ")}</div>`).join("")}</div>` : ""}
      ${plan.add.length ? `<div class="hist">${plan.add.slice(0, 30).map(r => `<div>＋ #${esc(r.no)} ${esc(r.title)}</div>`).join("")}</div>` : ""}
    </div><div class="df"><button type="button" class="btn line" data-close="1">ยกเลิก</button><button type="button" class="btn pri" id="impOk">นำเข้า</button></div>`;
    $("dlg").showModal();
  } catch (e) { alert("อ่านไฟล์ไม่สำเร็จ: " + e.message); }
}
function applyImport() {
  const { plan } = IMP, touched = [], at = nowIso();
  plan.add.forEach(r => { const o = byId(r.id); const t = Object.assign(o || {}, r, { src: srcOf(r), u: at, del: false, hist: [{ at, from: null, p: r.prog || 0 }] }); if (r.prog >= 100) t.doneAt = TODAY; if (!o) DATA.push(t); touched.push(t); });
  plan.upd.forEach(({ o, r, ch }) => { const p0 = progOf(o); ch.forEach(k => { o[k] = r[k]; }); o.src = srcOf(r); o.u = at; const p1 = progOf(o); if (p0 !== p1) { o.hist = (o.hist || []).concat({ at, from: p0, p: p1 }).slice(-30); if (p1 >= 100 && !o.doneAt) o.doneAt = TODAY; if (p1 < 100) delete o.doneAt; } touched.push(o); });
  persist(touched); $("dlg").close(); IMP = null; render();
}

/* ---------- Export Excel ---------- */
async function exportX() {
  try { await loadXLSX(); } catch (e) { alert(e.message); return; }
  const head = ["NO.", "งาน", "ผู้รับผิดชอบ", "ความสำคัญ", "Start date", "Target", "Progress", "สถานะ", "วันที่เสร็จจริง", "Notes"];
  const L = live().filter(t => !t.parent).sort((a, b) => String(a.no).localeCompare(String(b.no), undefined, { numeric: true })).flatMap(t => [t, ...kidsOf(t.id)]);
  const D = s => s ? new Date(s + "T00:00:00") : "";
  const aoa = [["งานที่ต้องทำประจำวันแผนกโครงการ · " + BD().n], ["Export " + fmtD(TODAY)], head].concat(L.map(t => [t.parent ? "" : t.no, (t.parent ? "   • " : "") + t.title, t.owner, PRI[t.pri || "M"], D(t.start), D(t.target), t.cancel ? "-" : (progOf(t) || 0) / 100, ST[stOf(t)].t, D(t.doneAt), t.note || ""]));
  const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true });
  ws["!cols"] = [6, 52, 16, 10, 12, 12, 10, 12, 14, 40].map(w => ({ wch: w }));
  const hs = { font: { bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "2E1A6B" } }, alignment: { horizontal: "center" } };
  head.forEach((_, i) => { const c = XLSX.utils.encode_cell({ r: 2, c: i }); if (ws[c]) ws[c].s = hs; });
  ws.A1.s = { font: { bold: true, sz: 14 } };
  L.forEach((t, i) => { const r = i + 3; ["E", "F", "I"].forEach(c => { const x = ws[c + (r + 1)]; if (x && x.t === "d") x.z = "d mmm yy"; }); const g = ws["G" + (r + 1)]; if (g && g.t === "n") g.z = "0%";
    const s = ws["H" + (r + 1)]; if (s) s.s = { font: { bold: true, color: { rgb: ST[stOf(t)].fg.slice(1) } }, fill: { fgColor: { rgb: ST[stOf(t)].bg.slice(1) } } }; });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Project Team"); XLSX.writeFile(wb, "Daily_Task_" + BD().n + "_" + TODAY + ".xlsx");
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const x = e.target.closest("[data-pp],[data-lv],[data-td],[data-fo],[data-sd],[data-ms],[data-mx],[data-mm],[data-rep],[data-print],[data-me],[data-rv],[data-rvp],[data-rvgo],[data-fget],[data-fdel],#fab,#bMe,#meOk,#meSkip");
  if (x) {
    if (x.id === "fab") { if (S.view !== "list") { S.view = "list"; render(); } const n = $("nT"); if (n) { n.scrollIntoView({ behavior: "smooth", block: "center" }); setTimeout(() => n.focus(), 250); } return; }
    if (x.id === "bMe") { askMe(true); return; }
    if (x.id === "meSkip") { try { sessionStorage.setItem("pcg-task-me-skip", "1"); } catch (e) {} $("dlg").close(); return; }
    if (x.id === "meOk") { const on = document.querySelector("[data-me].on"); setMe($("meIn").value || (on && on.dataset.me)); return; }
    if (x.dataset.me) { setMe(x.dataset.me); return; }
    if (x.dataset.rv) { startReview(); return; }
    if (x.dataset.rvp) { $("rvP").value = x.dataset.rvp; document.querySelectorAll("[data-rvp]").forEach(b => b.classList.toggle("on", b === x)); return; }
    if (x.dataset.rvgo) { reviewAct(x.dataset.rvgo); return; }
    if (x.dataset.fget) { getFile(x.dataset.fget); return; }
    if (x.dataset.fdel) { delFile(x.dataset.fdel, x); return; }
    if (x.dataset.ms) { S.ms = x.dataset.ms; S.mx = ""; render(); return; }
    if (x.dataset.mx) { S.mx = S.mx === x.dataset.mx ? "" : x.dataset.mx; render(); return; }
    if (x.dataset.mm) { S.mm = x.dataset.mm; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    if (x.dataset.rep) { exportRep(x.dataset.rep); return; }
    if (x.dataset.print) { window.print(); return; }
    if (x.dataset.sd) { S.sd = !S.sd; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    if (x.dataset.fo) { S.fo = !S.fo; renderFilters(); return; }
    if (x.dataset.td) { S.td = x.dataset.td; refreshTodo(); return; }
    if (x.dataset.lv) { S.lv = x.dataset.lv; try { localStorage.setItem("pcg-task-lv", S.lv); } catch (e) {} render(); return; }
    const [id, d] = x.dataset.pp.split("|"), t = byId(id); if (!t) return;
    const p0 = progOf(t) || 0, v = d[0] === "=" ? +d.slice(1) : Math.max(0, Math.min(100, p0 + +d));
    patchTask(t, { prog: v }); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  const g = e.target.closest("[data-bd],[data-view],[data-st],[data-go],[data-tog],[data-expand],[data-edit],[data-addkid],[data-pq],[data-close],[data-own],[data-mon]");
  if (!g) return;
  if (g.dataset.close) { $("dlg").close(); return; }
  if (g.dataset.bd) { S.bd = g.dataset.bd; S.own = "all"; S.st = "all"; S.mon = "all"; S.q = ""; S.open = {}; try { localStorage.setItem("pcg-task-bd", S.bd); } catch (e) {} render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (g.dataset.pq != null) { $("eR").value = g.dataset.pq; $("eR").oninput(); return; }
  if (g.dataset.addkid) { $("dlg").close(); openEdit(null, g.dataset.addkid); return; }
  if (g.dataset.tog) { e.stopPropagation(); S.open[g.dataset.tog] = !S.open[g.dataset.tog]; if (!S.open[g.dataset.tog]) delete S.open[g.dataset.tog]; render(); return; }
  if (g.dataset.expand) { if (Object.keys(S.open).length) S.open = {}; else live().filter(t => t.parent).forEach(t => S.open[t.parent] = true); render(); return; }
  if (g.dataset.edit) { if ($("dlg").open) $("dlg").close(); openEdit(g.dataset.edit); return; }
  if (g.dataset.view) { S.view = g.dataset.view; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (g.dataset.own) { S.own = g.dataset.own; S.view = "kpi"; render(); return; }
  if (g.dataset.mon) { S.mon = g.dataset.mon; S.st = "all"; S.view = "list"; render(); return; }
  if (g.dataset.go) { S.st = g.dataset.go; S.view = "list"; render(); return; }
  if (g.dataset.st === "pct") { S.st = "done"; S.view = "list"; render(); return; }
  if (g.dataset.st) { S.st = S.st === g.dataset.st && g.dataset.st !== "all" ? "all" : g.dataset.st; if (S.view === "ov" && g.classList.contains("kpi")) S.view = "list"; render(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "fOwn") { S.own = e.target.value; render(); } else if (e.target.id === "fPri") { S.pri = e.target.value; render(); }
  else if (e.target.id === "fMon") { S.mon = e.target.value; render(); } else if (e.target.id === "fCat") { S.cat = e.target.value; render(); } else if (e.target.id === "fSite") { S.site = e.target.value; render(); } else if (e.target.id === "fCx") { S.cx = e.target.checked; render(); }
});
let qT; document.addEventListener("input", e => { if (e.target.id === "fQ") { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("fQ"); q.focus(); q.setSelectionRange(pos, pos); }, 250); } });
document.addEventListener("change", e => {
  const el = e.target; if (!el.dataset || !el.dataset.f || !el.dataset.id) return;
  const t = byId(el.dataset.id); if (!t) return; let v = el.value;
  if (el.dataset.f === "title" && !v.trim()) { el.value = t.title; return; }
  if (el.dataset.f === "target") { const tp = tgtPatch(t, v); if (!tp) { el.value = t.target || ""; return; } const ids = patchTask(t, tp).map(x => x.id); redrawRows(ids); return; }
  v = el.dataset.f === "prog" ? +v : clean(v.trim());
  const ids = patchTask(t, { [el.dataset.f]: v }).map(x => x.id); redrawRows(ids);
  const n = document.querySelector(`tr[data-row="${t.id}"] [data-f="${el.dataset.f}"]`); if (n) { n.classList.add("saved"); setTimeout(() => n.classList.remove("saved"), 700); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest && e.target.closest("tr.add, .qadd")) { e.preventDefault(); quickAdd(); }
  else if (e.key === "Enter" && !e.shiftKey && e.target.classList && e.target.classList.contains("ci") && /INPUT|TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); e.target.blur(); } });
/* ช่องชื่องาน/หมายเหตุ ขยายตามความยาวข้อความ */
const grow = el => { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; };
document.addEventListener("input", e => { if (e.target.classList && e.target.classList.contains("ta")) grow(e.target); });
$("dlgf").addEventListener("click", e => { if (e.target.id === "eSave") saveEdit(); else if (e.target.id === "eDel") delEdit(); else if (e.target.id === "impOk") applyImport(); });
$("bAdd").onclick = () => openEdit(null);
document.addEventListener("click", e => { if (e.target.id === "nAdd") quickAdd(); });
document.addEventListener("change", e => { if (e.target.id === "eF" && e.target.files.length) addFiles([...e.target.files]); });
document.addEventListener("change", e => { if (e.target.id === "fSort") { S.sort = e.target.value; render(); } });
/* ทีมกรอกพร้อมกันหลายเครื่อง: ดึงข้อมูลล่าสุดทุก 1 นาที และเมื่อกลับมาที่แท็บ (ไม่ดึงตอนกำลังพิมพ์/เปิดฟอร์ม) */
const busy = () => $("dlg").open || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.id !== "fQ");
setInterval(() => { if (!document.hidden && SBOK && !busy()) sbSync(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && SBOK && !busy()) sbSync(); });
$("bImp").onclick = () => $("file").click();
$("file").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) importFile(f); };
$("bExp").onclick = exportX;
/* tooltip กราฟรายเดือน */
const tip = $("tip");
document.addEventListener("mousemove", e => { const c = e.target.closest(".mcol"); if (!c) { tip.style.display = "none"; return; } const d = JSON.parse(c.dataset.tip);
  tip.innerHTML = `<b>Target ${fmtM(d.m)}</b>` + ORDER.filter(k => d.v[k]).map(k => `<div><span><i style="background:${ST[k].c}"></i>${ST[k].t}</span><b style="display:inline">${d.v[k]}</b></div>`).join("") + `<div style="border-top:1px solid rgba(255,255,255,.2);margin-top:4px;padding-top:4px"><span>รวม</span><b style="display:inline">${ORDER.reduce((a, k) => a + d.v[k], 0)}</b></div>`;
  tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 10) + "px"; tip.style.top = (e.clientY + 14) + "px"; });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h !== S.view && ["ov", "list", "mg", "mo", "tl", "kpi", "guide"].includes(h)) { S.view = h; render(); } });
applyTheme(); meLabel(); setTimeout(() => askMe(), 600);
$("bTheme").onclick = () => { DT = !DT; try { localStorage.setItem("pcg-task-theme", DT ? "dark" : "light"); } catch (e) {} applyTheme(); render(); };
const tick = () => { $("clock").textContent = new Date().toLocaleString("th-TH", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit" }); }; tick(); setInterval(tick, 1000);
render(); syncLabel(); sbSync();
</script>
