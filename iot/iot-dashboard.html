<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<style>
/* IOT Dashboard (6 ต.ค. 2569) · Tuya → GitHub Actions ทุก 15 นาที → Supabase iot_devices / iot_readings
   จัดหน้าแยกตามคลัง (ผู้ใช้เลือก 6 ต.ค.) · ตั้งชื่อ/คลัง/ตำแหน่ง/เกณฑ์อุณหภูมิบนเว็บ → iot_device_meta
   ธีม: น้ำเงินเข้ม → ไซแอน (สไตล์ Portal: โค้ง ไล่สี เงา) · สีทั้งหน้าอยู่ใน :root */
:root{
  --bg:#eef3f8; --card:#fff; --ink:#17212b; --ink2:#46535f; --mute:#77848f; --line:#e1e8ef; --grid:#edf1f5;
  --h1:#0b2a4a; --h2:#0f5c8c; --h3:#12a5c2;
  --acc:#0f7fb0; --temp:#0f7fb0; --hum:#5b6bd6; --pow:#7a4fc9;
  --ok:#1f9d61; --warn:#c77a06; --bad:#c7362b; --off:#8a96a3;
  --r:20px; --sh:0 10px 30px rgba(16,42,72,.10), 0 2px 6px rgba(16,42,72,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 40px}
/* หัว */
header.hero{background:linear-gradient(120deg,var(--h1),var(--h2) 55%,var(--h3));color:#fff;border-radius:0 0 28px 28px;box-shadow:var(--sh);margin-bottom:20px}
.hero .wrap{padding-top:18px;padding-bottom:22px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home,.hbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:13px;color:#fff;cursor:pointer}
.home:hover,.hbtn:hover{background:rgba(255,255,255,.24)}
.hbtn{margin-left:auto}
.badge{font-size:12px;font-weight:700;background:#34d399;color:#053b26;padding:3px 10px;border-radius:999px;letter-spacing:.04em}
h1{margin:14px 0 2px;font:800 30px/1.15 Archivo,"IBM Plex Sans Thai",sans-serif;letter-spacing:-.01em}
.sub{opacity:.85}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.seg{display:inline-flex;flex-wrap:wrap;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px}
.seg button{font-weight:600;font-size:13px;color:#fff;background:none;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.seg button.on{background:#fff;color:var(--h1)}
.upd{margin-left:auto;font-size:13px;opacity:.9}
/* การ์ดสรุป */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c,var(--acc))}
.kpi .l{color:var(--ink2);font-weight:600;font-size:13.5px}
.kpi .v{font:800 34px/1.1 Archivo,sans-serif;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;font-weight:700;color:var(--ink2);margin-left:4px}
.kpi .s{color:var(--mute);font-size:12.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ต้องดูตอนนี้ */
.alerts{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 18px;margin-bottom:22px;border-left:5px solid var(--bad)}
.alerts.okk{border-left-color:var(--ok)}
.alerts h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.alerts h3 .b{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px}
.al{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.al:first-of-type{border-top:0}
.al .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.al .t{flex:1;min-width:0}
.al .t b{font-weight:700}
.al .t span{color:var(--mute);font-size:12.5px;margin-left:6px}
.al .v{font:800 16px Archivo,sans-serif;white-space:nowrap}
.ic.hot{background:#fde8e6;color:var(--bad)} .ic.cold{background:#e4eefc;color:#2a62c9} .ic.offl{background:#eef1f4;color:#5d6873} .ic.humi{background:#ecebfb;color:#4f46c8}
.more{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;padding:6px 0 0}
/* บล็อกคลัง */
.site{background:var(--card);border-radius:24px;box-shadow:var(--sh);margin-bottom:22px;overflow:hidden}
.shd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;background:linear-gradient(120deg,#f4f8fc,#e9f3fa);border-bottom:1px solid var(--line)}
.shd .nm{font:800 22px/1 Archivo,"IBM Plex Sans Thai",sans-serif;color:var(--h1);display:flex;align-items:center;gap:10px}
.shd .nm i{width:12px;height:30px;border-radius:6px;background:linear-gradient(180deg,var(--h3),var(--h2))}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.stat{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.stat b{color:var(--ink);font-family:Archivo,sans-serif}
.stat.bad{background:#fdecea;border-color:#f3c2bc;color:#9b2a20}
.sbody{padding:6px 20px 18px}
.grp{margin-top:14px}
.grp h4{margin:0 0 10px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:8px;font-weight:700}
.grp h4 .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff}
.grp h4 .dot svg{width:13px;height:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dev{background:#fbfcfe;border:1px solid var(--line);border-radius:18px;padding:14px 16px 10px;cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left;width:100%;position:relative}
.dev:hover,.dev:focus-visible{transform:translateY(-2px);box-shadow:var(--sh);outline:none}
.dev.hot{border-color:#f0a59c;background:#fff6f5} .dev.cold{border-color:#a9c3ef;background:#f5f9ff}
.dev .hd{display:flex;align-items:flex-start;gap:8px}
.dev .nm{font-weight:700;flex:1;min-width:0;line-height:1.3}
.dev .nm small{display:block;color:var(--mute);font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.flag.hot{background:var(--bad);color:#fff} .flag.cold{background:#2a62c9;color:#fff} .flag.stale{background:#fff1d6;color:#8a5600}
.big{display:flex;align-items:baseline;gap:12px;margin:10px 0 0}
.big .v{font:800 36px/1 Archivo,sans-serif;font-variant-numeric:tabular-nums}
.big .v small{font-size:16px;color:var(--ink2);font-weight:700;margin-left:2px}
.big .v2{color:var(--ink2);font-weight:600;font-size:13.5px}
.big .v2 b{font:700 17px Archivo,sans-serif;color:var(--ink)}
.spark{display:block;width:100%;height:58px;margin-top:6px}
.meta{color:var(--mute);font-size:12.5px;display:flex;justify-content:space-between;gap:8px;margin-top:2px}
.dev.isoff .big .v{color:var(--off)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.st.ok{color:var(--ok)} .st.off{color:var(--off)} .st.stale{color:var(--warn)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.swi{background:#fbfcfe;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.swi .main{flex:1;min-width:0;cursor:pointer}
.swi .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swi .sub2{font-size:12.5px;color:var(--mute)}
.pill{font-size:12.5px;font-weight:800;padding:4px 12px;border-radius:999px;white-space:nowrap}
.pill.on{background:#dcf5e8;color:#11683f} .pill.offp{background:#eef1f4;color:#4d5864}
.ctl{display:inline-flex;gap:6px;flex-shrink:0}
.ctl button{font-weight:700;font-size:12.5px;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.ctl .bOn{background:linear-gradient(135deg,#34c38f,#1f9d61);color:#fff} .ctl .bOff{background:#eef2f6;color:#33404d}
.offrow{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.offrow button.tg{background:none;border:0;cursor:pointer;color:var(--ink2);font-weight:700;font-size:13px;padding:0}
.offlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.offc{background:#f1f3f5;border-radius:999px;padding:4px 10px;font-size:12.5px;color:#4d5864;cursor:pointer;border:0}
.offc:hover{background:#e3e7eb}
/* แผนที่ 3D */
.mapcard{background:var(--card);border-radius:24px;box-shadow:var(--sh);overflow:hidden;margin-bottom:18px}
.mapbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.mapbar h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.tabs{display:inline-flex;background:#eef3f8;border-radius:999px;padding:3px}
.tabs button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink2)}
.tabs button.on{background:linear-gradient(135deg,var(--h2),var(--h1));color:#fff;box-shadow:0 3px 10px rgba(15,92,140,.3)}
.tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-weight:600;font-size:12.5px;cursor:pointer}
.tools button.on{background:#0f5c8c;color:#fff;border-color:#0f5c8c}
#map3d{position:relative;height:560px;background:#e9f0f7;touch-action:none}
#map3d canvas{display:block;width:100%;height:100%}
#map3d.placing canvas{cursor:crosshair}
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;border:0;background:none;padding:0;cursor:pointer;pointer-events:auto;will-change:transform}
.pin .pb{position:absolute;bottom:6px;left:0;transform:translateX(-50%);white-space:nowrap;background:#fff;border-radius:10px;padding:4px 9px;font:800 13px/1.2 Archivo,"IBM Plex Sans Thai",sans-serif;color:var(--ink);box-shadow:0 4px 14px rgba(11,42,74,.25);border:2px solid var(--pc,#0f7fb0)}
.pin .pb small{font-weight:600;color:var(--mute);font-size:11px;margin-left:4px}
.pin i{position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--pc,#0f7fb0);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pin.temp{--pc:#0f7fb0} .pin.pow{--pc:#7a4fc9} .pin.sw,.pin.ir{--pc:#1f9d61}
.pin.off{--pc:#8a96a3} .pin.off .pb{color:#8a96a3;background:#f4f6f8}
.pin.hot{--pc:#c7362b} .pin.hot .pb{background:#c7362b;color:#fff;animation:pulse 1.4s infinite} .pin.hot .pb small{color:#ffd9d4}
.pin.cold{--pc:#2a62c9} .pin.cold .pb{background:#2a62c9;color:#fff}
.pin:hover .pb,.pin.sel .pb{transform:translateX(-50%) scale(1.12)}
.pin .pb .nm{display:none;font:600 11px "IBM Plex Sans Thai",sans-serif;color:inherit;opacity:.8}
.pin:hover .pb .nm,.pin.sel .pb .nm{display:block}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(199,54,43,.55)}50%{box-shadow:0 0 0 10px rgba(199,54,43,0)}}
.mlegend{z-index:2500;position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(0,0,0,.08);max-width:calc(100% - 24px)}
.mlegend span{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);font-weight:600}
.mlegend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.mhint{z-index:3000;position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0b2a4a;color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);display:none;white-space:nowrap}
.mhint.on{display:block}
.unplaced{z-index:2500;position:absolute;right:12px;top:12px;background:rgba(255,255,255,.95);border-radius:12px;padding:7px 12px;font-size:12.5px;font-weight:700;color:#8a5600;box-shadow:0 4px 14px rgba(0,0,0,.08);border:0;cursor:pointer}
.ppanel{z-index:3000;position:absolute;right:12px;top:12px;bottom:12px;width:290px;background:rgba(255,255,255,.97);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
.ppanel .ph{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;display:flex;align-items:center;gap:8px}
.ppanel .ph button{margin-left:auto;border:0;background:#eef2f6;border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer}
.ppanel .pl{overflow:auto;padding:6px 8px}
.pr{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:10px}
.pr.sel{background:#e6f2fa}
.pr .n{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .n small{display:block;color:var(--mute);font-weight:500;font-size:11.5px}
.pr button{border:0;border-radius:8px;padding:4px 9px;font-weight:700;font-size:12px;cursor:pointer;background:#0f5c8c;color:#fff}
.pr button.rm{background:#eef2f6;color:#4d5864}
.nomap{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:20px}
#map3d.pm .mlegend,#map3d.pm .hlegend{display:none}
.mlist{position:absolute;left:12px;top:12px;width:268px;max-height:calc(100% - 80px);background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:16px;box-shadow:0 10px 30px rgba(11,42,74,.16);z-index:2400;display:flex;flex-direction:column;overflow:hidden}
.mlist.shut{width:auto}
.mlh{display:flex;align-items:center;gap:6px;border:0;background:none;padding:10px 12px;cursor:pointer;text-align:left;font-size:13px;width:100%}
.mlh b{white-space:nowrap}.mlh .b{white-space:nowrap;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px}.b.r{background:#fdecea;color:#9b2a20}.b.g{background:#eef1f4;color:#5d6873}
.mlh .cv{margin-left:auto;color:var(--mute)}
.mlb{overflow:auto;padding:0 6px 8px;border-top:1px solid var(--line)}
.mli{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;border-radius:10px;padding:5px 8px;cursor:pointer;text-align:left}
.mli:hover,.mli.sel{background:#e9f3fa}
.mli i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.mli .n{flex:1;min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mli .n small{display:block;font-weight:500;color:var(--mute);font-size:11.5px}
.mli .v{font:700 12.5px Archivo,"IBM Plex Sans Thai",sans-serif;white-space:nowrap;color:var(--ink2)}
.mli.al .v{color:var(--bad)} .mli.off{opacity:.6}
.mcard{position:absolute;z-index:2600;width:250px;background:#fff;border-radius:16px;box-shadow:0 14px 40px rgba(11,42,74,.25);padding:12px 14px;display:none;pointer-events:auto}
.mcard .ch{display:flex;align-items:center;gap:8px}.mcard .ch b{flex:1;min-width:0;font-size:14px}
.mcard .cs{color:var(--mute);font-size:12px}
.mcard .ca{background:#fdecea;color:#9b2a20;border-radius:8px;padding:4px 8px;font-weight:700;font-size:12px;margin-top:6px}
.mcard .cv{font:800 24px Archivo,"IBM Plex Sans Thai",sans-serif;margin-top:6px}
.mcard .csp{display:block;width:100%;height:46px;margin-top:4px}
.mcard .cf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-size:12px;color:var(--mute)}
.mcard .cf button{border:0;background:#0f5c8c;color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px;cursor:pointer}
.hlegend{position:absolute;right:12px;bottom:12px;z-index:2500;background:rgba(255,255,255,.93);border-radius:12px;padding:7px 12px;font-size:12px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.hlegend i{display:inline-block;width:120px;height:10px;border-radius:999px}
.hlegend span{font-weight:700;font-family:Archivo,sans-serif}
.mtime{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.mtime button{border:0;border-radius:999px;background:#eef3f8;font-weight:800;padding:6px 12px;cursor:pointer}
.mtime #tPlay{width:38px;height:34px;background:linear-gradient(135deg,var(--h2),var(--h1));color:#fff}
.mtime input{flex:1;min-width:160px;accent-color:#0f5c8c}
.mtime .tl{font-weight:700;font-size:13px;color:var(--ink2);min-width:120px}
.mtime .tl.live{color:var(--ok)}
.mapcard:fullscreen,.mapcard.fs{border-radius:0;margin:0;display:flex;flex-direction:column;background:#fff}
.mapcard.fs{position:fixed;inset:0;z-index:90}
.mapcard:fullscreen #map3d,.mapcard.fs #map3d{flex:1;height:auto}
@media (max-width:640px){.mlist{width:auto;right:12px;max-height:45%}.mlist.shut{right:auto}.hlegend{bottom:auto;top:56px;right:12px}.hlegend i{width:70px}.mcard{width:220px}}

@media (max-width:640px){#map3d{height:440px}.mlegend{font-size:11px;gap:8px;padding:6px 10px}.mtip{display:none!important}.ppanel{left:12px;width:auto;top:auto;height:44%}.tools{margin-left:0}}
.note{background:#fff8e6;border:1px solid #f1d58c;color:#6b4d00;border-radius:16px;padding:12px 16px;margin-bottom:16px}
.note b{display:block;margin-bottom:2px}
.empty{color:var(--mute);padding:6px 0}
.tip{position:fixed;pointer-events:none;background:#17212b;color:#fff;border-radius:10px;padding:7px 10px;font-size:12.5px;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:70;display:none;white-space:nowrap}
.tip b{font:700 15px Archivo,sans-serif;display:block}
/* หน้าต่าง */
.dlg{position:fixed;inset:0;background:rgba(12,24,38,.5);display:none;align-items:flex-start;justify-content:center;padding:28px 16px;z-index:40;overflow:auto}
.dlg.open{display:flex}
.box{background:var(--card);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.3);width:min(880px,100%);padding:20px 22px}
.box.wide{width:min(1180px,100%)}
.bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.box h3{margin:0;font-size:20px;flex:1;min-width:0}
.x{font-weight:700;border:0;background:#eef2f6;border-radius:12px;padding:7px 12px;cursor:pointer}
.chartT{font-weight:700;margin:16px 0 4px;color:var(--ink2);font-size:13.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.chartT span{font-weight:500;color:var(--mute);font-size:12.5px}
.chart{display:block;width:100%;height:210px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--mute);font-weight:600;position:sticky;top:0;background:#fff}

<script>
const SB = "https://mgnshovnibcmiptoxdfe.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbnNob3ZuaWJjbWlwdG94ZGZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNzI1NDIsImV4cCI6MjEwNDk0ODU0Mn0.UoPu-i6ODMEgyuqoO6oKHf0JIqFKpWkSpBkOKrpITwQ";
const H = { apikey: ANON, Authorization: "Bearer " + ANON };
const DEMO = /[?&]demo=1/.test(location.search);
// รูปแบบหน้าจอ A/B/C · ?ui=a|b|c หรือจำค่าล่าสุดในเครื่อง
const UI_KEY = "pcg-iot-ui";
function setUI(u) {
  u = ["a", "b", "c"].includes(u) ? u : "b";
  document.body.classList.remove("ui-a", "ui-b", "ui-c"); document.body.classList.add("ui-" + u);
  document.querySelectorAll("#uiSw [data-ui]").forEach(b => b.classList.toggle("on", b.dataset.ui === u));
  try { localStorage.setItem(UI_KEY, u); } catch {}
  if (window.IOT3D) { IOT3D.theme(u === "a" ? "dark" : "light"); setTimeout(() => IOT3D.show(S.map), 30); }
  window.__ui = u;
}
const CONTROL_ON = false;       // ปุ่มเปิด/ปิด: เปิดใช้หลังติดตั้ง Edge Function iot-control (ผู้ใช้ขอให้ทำหน้าให้เรียบร้อยก่อน 6 ต.ค.)
const S = { site: "", range: 24, devs: [], reads: {}, open: {}, showAllAl: false, map: "wh5", placeMode: false, placeSel: "", heat: true, tAt: null, selPin: null, hoverId: null, listOpen: false };
const STALE_MIN = 45;           // ไม่ได้ค่าใหม่เกิน 45 นาที = ข้อมูลค้าง
const NOSITE = "ไม่ระบุคลัง";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = (x, d = 1) => x == null || isNaN(x) ? "–" : Number(x).toLocaleString("th-TH", { minimumFractionDigits: d, maximumFractionDigits: d });
const TH_TIME = (d) => d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" });
const TH_DT = (d) => d.toLocaleString("th-TH", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" });
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "เมื่อสักครู่" : m < 60 ? m + " นาทีที่แล้ว" : m < 1440 ? Math.floor(m / 60) + " ชม. ที่แล้ว" : Math.floor(m / 1440) + " วันที่แล้ว"; };
const KIND = (d) => ({ qxj: "temp", wnykq: "temp", dlq: "pow", kg: "sw", znjdq: "sw", infrared_ac: "ir" })[d.category] || "sw";
const TYPE_TH = { temp: "เซนเซอร์อุณหภูมิ", pow: "มิเตอร์ไฟ", sw: "สวิตช์", ir: "แอร์ (รีโมต)" };
const ICON = {
  temp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M14 14.8V4a2 2 0 1 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>',
  pow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  sw: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>'
};

/* ---------- ตั้งค่าอุปกรณ์ (ชื่อ คลัง ตำแหน่ง เกณฑ์) · Supabase iot_device_meta หรือ localStorage ---------- */
let META = {}, META_DB = true;
const LSM = "pcg-iot-meta";
const lsMeta = () => { try { return JSON.parse(localStorage.getItem(LSM) || "{}"); } catch { return {}; } };
const m = (d) => { const x = META[d.id] || {}; if (x.map === "wha") x.map = (+x.px || 0) < 903 ? "wh32" : "wh5"; return x; }; /* หมุดเดิมบนผังรวม WHA → แยกตามฝั่งผนัง */
const nameOf = (d) => m(d).label || d.name;
const siteOf = (d) => m(d).site || d.site || NOSITE;
const numOr = (v) => v === "" || v == null || isNaN(+v) ? null : +v;
async function loadMeta() {
  if (DEMO) { META = Object.assign(demoMeta(), lsMeta()); META_DB = false; return; }
  try {
    const r = await fetch(SB + "/rest/v1/iot_device_meta?select=*", { headers: H });
    if (!r.ok) throw 0;
    META = {}; for (const x of await r.json()) META[x.id] = x; META_DB = true;
  } catch { META = lsMeta(); META_DB = false; }
}
async function saveMeta(id, patch) {
  META[id] = Object.assign({}, META[id], patch, { id });
  if (META_DB) {
    const r = await fetch(SB + "/rest/v1/iot_device_meta?on_conflict=id", { method: "POST",
      headers: { ...H, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ ...META[id], updated_at: new Date().toISOString() }) }).catch(() => null);
    if (r && r.ok) return true;
    META_DB = false; showMsg();
  }
  try { const all = lsMeta(); all[id] = META[id]; localStorage.setItem(LSM, JSON.stringify(all)); } catch {}
  return false;
}

/* ---------- โหลดข้อมูล ---------- */
async function get(path) {
  const out = [];
  for (let off = 0; off < 100000; off += 1000) {
    const r = await fetch(SB + "/rest/v1/" + path, { headers: { ...H, Range: off + "-" + (off + 999), "Range-Unit": "items" } });
    if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 200));
    const j = await r.json(); out.push(...j); if (j.length < 1000) break;
  }
  return out;
}
let LOAD_ERR = "";
async function load() {
  $("#upd").textContent = "กำลังโหลด…";
  try {
    let devs, rows;
    if (DEMO) ({ devs, rows } = demo());
    else {
      const since = new Date(Date.now() - S.range * 3600e3).toISOString();
      [devs, rows] = await Promise.all([
        get("iot_devices?select=id,name,category,product,site,online,updated_at&order=name"),
        get("iot_readings?select=device_id,ts,online,temp_c,humidity,power_w,voltage_v,current_a,energy_kwh,switch_on&ts=gte." + since + "&order=ts"),
        loadMeta()
      ]);
    }
    if (DEMO) await loadMeta();
    S.devs = devs; S.reads = {};
    for (const r of rows) (S.reads[r.device_id] = S.reads[r.device_id] || []).push({ ...r, t: new Date(r.ts).getTime() });
    LOAD_ERR = ""; render();
  } catch (e) {
    $("#upd").textContent = "โหลดไม่สำเร็จ";
    LOAD_ERR = /PGRST205|404|does not exist/.test(e.message) ? "ยังไม่มีตาราง iot_devices / iot_readings → รัน iot/tools/iot.sql ใน Supabase" : e.message;
    showMsg();
  }
}
function showMsg() {
  const n = [];
  if (LOAD_ERR) n.push(`<div class="note"><b>โหลดข้อมูลจาก Supabase ไม่สำเร็จ</b>${esc(LOAD_ERR)}</div>`);
  else if (!S.devs.length) n.push(`<div class="note"><b>ยังไม่มีข้อมูล</b>รอ GitHub Actions "IOT · ดึงข้อมูล Tuya ทุก 15 นาที" รันสำเร็จครั้งแรก</div>`);
  if (!META_DB && !DEMO) n.push(`<div class="note"><b>ชื่อ/เกณฑ์ที่ตั้งเก็บในเครื่องนี้เท่านั้น</b>ยังไม่มีตาราง iot_device_meta ใน Supabase → รัน iot/tools/iot-meta.sql แล้วตั้งค่าใหม่อีกครั้ง ทุกเครื่องจะเห็นตรงกัน</div>`);
  $("#msg").innerHTML = n.join("");
}

/* ---------- สถานะต่ออุปกรณ์ ---------- */
function info(d) {
  const rs = S.reads[d.id] || [];
  const last = rs[rs.length - 1] || {};
  const t = rs.length ? last.t : new Date(d.updated_at).getTime();

const stHtml = (s) => s === "ok" ? '<span class="st ok"><i></i>ออนไลน์</span>' : s === "stale" ? '<span class="st stale"><i></i>ข้อมูลค้าง</span>' : '<span class="st off"><i></i>ออฟไลน์</span>';

/* ---------- กราฟเส้น (1 ชุดต่อกราฟ · crosshair + tooltip · เส้นเกณฑ์ประสีแดง) ---------- */
const UNIT = { temp_c: "°C", humidity: "%", power_w: "W", voltage_v: "V" };
const COL = { temp_c: "var(--temp)", humidity: "var(--hum)", power_w: "var(--pow)", voltage_v: "var(--pow)" };
function line(svg, rs, k, o = {}) {
  const W = svg.clientWidth || 300, H = svg.clientHeight || 58;
  const pts = rs.filter(r => r[k] != null).map(r => [r.t, +r[k]]);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (pts.length < 2) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2 + 4}" text-anchor="middle" fill="#9aa6b2" font-size="12">${pts.length ? "กำลังเก็บข้อมูล · กราฟจะขึ้นเมื่อมีหลายรอบ" : "ไม่มีข้อมูลในช่วงนี้"}</text>`; svg.onpointermove = null; return; }
  const pl = o.spark ? 2 : 46, pr = o.spark ? 4 : 10, pt = o.spark ? 6 : 10, pb = o.spark ? 4 : 24;
  const t0 = Date.now() - S.range * 3600e3, t1 = Date.now();
  const th = (o.th || []).filter(v => v != null);
  let lo = Math.min(...pts.map(p => p[1]), ...th), hi = Math.max(...pts.map(p => p[1]), ...th);
  if (k === "power_w") lo = 0;
  if (hi - lo < 1) { hi += .5; lo -= .5; }
  const pad = (hi - lo) * .12; hi += pad; if (k !== "power_w") lo -= pad;
  const X = t => pl + (t - t0) / (t1 - t0) * (W - pl - pr), Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  let d = "", prev = null;
  for (const [t, v] of pts) { d += (prev == null || t - prev > 45 * 60000 ? "M" : "L") + X(t).toFixed(1) + "," + Y(v).toFixed(1); prev = t; }
  let g = "";
  if (!o.spark) {
    for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, y = Y(v);
      g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" fill="#77848f" font-size="11">${f1(v, k === "power_w" && hi > 1000 ? 0 : 1)}</text>`; }
    const step = S.range === 24 ? 6 * 3600e3 : 24 * 3600e3;
    for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step)
      g += `<text x="${X(t)}" y="${H - 6}" text-anchor="middle" fill="#77848f" font-size="11">${S.range === 24 ? TH_TIME(new Date(t)) : new Date(t).toLocaleDateString("th-TH", { day: "numeric", month: "short", timeZone: "Asia/Bangkok" })}</text>`;
  }
  for (const v of th) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".7"/>`;
  const [lt, lv] = pts[pts.length - 1];
  svg.innerHTML = g + `<path d="${d}" fill="none" stroke="${COL[k]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(lt)}" cy="${Y(lv)}" r="3.5" fill="${COL[k]}" stroke="#fff" stroke-width="2"/>
    <line class="xh" y1="${pt}" y2="${H - pb}" stroke="#9aa6b2" stroke-width="1" style="display:none"/><circle class="xd" r="4" fill="${COL[k]}" stroke="#fff" stroke-width="2" style="display:none"/>`;
  const xh = svg.querySelector(".xh"), xd = svg.querySelector(".xd"), tip = $("#tip");
  svg.onpointermove = (e) => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    const t = t0 + (mx - pl) / (W - pl - pr) * (t1 - t0);
    let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
    const x = X(best[0]), y = Y(best[1]);
    xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.style.display = ""; xd.setAttribute("cx", x); xd.setAttribute("cy", y); xd.style.display = "";
    tip.innerHTML = ""; const b = document.createElement("b"); b.textContent = f1(best[1], k === "power_w" ? 0 : 1) + " " + UNIT[k];
    const s = document.createElement("div"); s.textContent = TH_DT(new Date(best[0])); tip.append(b, s);
    tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY - 48) + "px";
  };
  svg.onpointerleave = () => { xh.style.display = xd.style.display = "none"; tip.style.display = "none"; };
}

  $("#mtime").innerHTML = `<button id="tPlay" title="เล่นย้อนหลัง">${playT ? "❚❚" : "▶"}</button>
    <input type="range" id="tRange" min="0" max="${n}" value="${Math.max(0, Math.min(n, v))}" aria-label="เลือกเวลา">
    <span class="tl ${S.tAt == null ? "live" : ""}">${S.tAt == null ? "● สด · ตอนนี้" : TH_DT(new Date(S.tAt))}</span>${S.tAt != null ? '<button id="tNow">กลับมาตอนนี้</button>' : ""}`;
}
function setT(v) {
  const now = Date.now(), t0 = now - S.range * 3600e3, step = 15 * 60000, n = Math.round((now - t0) / step);
  S.tAt = v >= n ? null : t0 + v * step; renderMap();
}
document.addEventListener("input", (e) => { if (e.target.id === "tRange") { stopPlay(); setT(+e.target.value); } });
function stopPlay() { if (playT) { clearInterval(playT); playT = 0; } }
function startPlay() {
  const now = Date.now(), t0 = now - S.range * 3600e3, step = 15 * 60000, n = Math.round((now - t0) / step);
  let v = S.tAt == null ? 0 : Math.round((S.tAt - t0) / step);
  const inc = S.range === 24 ? 2 : 8;
  playT = setInterval(() => { v += inc; if (v >= n) { stopPlay(); setT(n); return; } setT(v); }, 260);
  renderTime();
}
document.addEventListener("click", async (e) => {
  const t = e.target;
  const mt = t.closest("[data-map]"); if (mt) { S.map = mt.dataset.map; S.placeSel = ""; S.selPin = null; $("#mcard").style.display = "none"; renderMap(); return; }
  const v = t.closest(".tools [data-v]"); if (v && window.IOT3D) { document.querySelectorAll(".tools [data-v]").forEach(b => b.classList.toggle("on", b === v)); IOT3D.view(v.dataset.v); return; }
  const sp = t.closest("#btnSpin"); if (sp && window.IOT3D) { sp.classList.toggle("on", IOT3D.spin(!sp.classList.contains("on"))); return; }
  if (t.closest("#btnHeat")) { S.heat = !S.heat; renderMap(); return; }
  if (t.closest("#btnFull")) { const c = document.querySelector(".mapcard"); if (document.fullscreenElement) document.exitFullscreen(); else c.requestFullscreen?.().catch(() => c.classList.toggle("fs")); return; }
  if (t.closest("#listTg")) { S.listOpen = !S.listOpen; renderMap(); return; }
  if (t.closest("#tPlay")) { if (playT) { stopPlay(); renderTime(); } else startPlay(); return; }
  if (t.closest("#tNow")) { stopPlay(); S.tAt = null; renderMap(); return; }
  const fl = t.closest("[data-fly]"); if (fl && window.IOT3D) { const d = S.devs.find(x => x.id === fl.dataset.fly); S.selPin = d.id; S.hoverId = d.id; IOT3D.flyTo(+m(d).px, +m(d).py); renderMap(); setTimeout(() => showCard(d.id), 700); return; }
  const op = t.closest("[data-open]"); if (op) { e.stopPropagation(); openDev(op.dataset.open); return; }
  if (t.closest("#btnPlace") || t.closest("#unplacedBtn")) { S.placeMode = !S.placeMode || !!t.closest("#unplacedBtn"); S.placeSel = ""; S.selPin = null; $("#mcard").style.display = "none"; renderMap(); return; }
  if (t.closest("#placeDone")) { S.placeMode = false; S.placeSel = ""; renderMap(); return; }
  const pk = t.closest("[data-pick]"); if (pk) { S.placeSel = S.placeSel === pk.dataset.pick ? "" : pk.dataset.pick; renderMap(); return; }
  const up = t.closest("[data-unpin]"); if (up) { await saveMeta(up.dataset.unpin, { map: null, px: null, py: null }); renderMap(); return; }
  const pin = t.closest(".pin"); if (pin) { e.stopPropagation(); if (S.placeMode) return;
    const d = S.devs.find(x => x.id === pin.dataset.id);
    if (S.selPin === pin.dataset.id) { openDev(pin.dataset.id); return; }  // กดซ้ำ = เปิดรายละเอียด
    S.selPin = d.id; S.hoverId = d.id; IOT3D.flyTo(+m(d).px, +m(d).py); renderMap(); setTimeout(() => showCard(d.id), 700); }
}, true);
document.addEventListener("fullscreenchange", () => setTimeout(() => window.IOT3D && IOT3D.show(S.map), 50));

/* ---------- สั่งเปิด/ปิด (ปิดไว้ก่อน CONTROL_ON = false · ผ่าน Supabase Edge Function iot-control) ---------- */
const CTRL = new Set(["kg", "znjdq", "infrared_ac"]);   // ผู้ใช้เลือก 6 ต.ค.: พัดลม/สวิตช์ · Skylight · แอร์อินฟราเรด (ไม่รวมมิเตอร์ไฟ dlq)
const FN = SB + "/functions/v1/iot-control";
const PK = "pcg-iot-pin", TODAY = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });
const pinGet = () => { try { const g = JSON.parse(localStorage.getItem(PK) || "null"); return g && g.day === TODAY ? g.pin : ""; } catch { return ""; } };
const pinSet = (p) => { try { p ? localStorage.setItem(PK, JSON.stringify({ pin: p, day: TODAY })) : localStorage.removeItem(PK); } catch {} };
function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 3500); }
async function callFn(body) {
  if (DEMO) return { ok: true, msg: body.on ? "สั่งเปิดแล้ว (ตัวอย่าง)" : "สั่งปิดแล้ว (ตัวอย่าง)" };
  try {
    const r = await fetch(FN, { method: "POST", headers: { ...H, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 404) return { ok: false, msg: "ยังไม่ได้ติดตั้งฟังก์ชัน iot-control ใน Supabase", code: 404 };
    return { ok: !!j.ok, msg: j.msg || ("ผิดพลาด " + r.status), code: r.status };
  } catch (e) { return { ok: false, msg: "เชื่อมต่อไม่ได้: " + e.message }; }
}
function askCmd(id, on) {
  const d = S.devs.find(x => x.id === id); if (!d) return;
  $("#box").className = "box";
  $("#box").innerHTML = `<form class="pinbox" id="pinForm"><div class="bh"><h3>${on ? "เปิด" : "ปิด"} · ${esc(nameOf(d))}</h3></div>
    <div style="color:var(--ink2)">ยืนยันสั่ง<b>${on ? "เปิด" : "ปิด"}</b>อุปกรณ์นี้${KIND(d) === "ir" ? " (แอร์สั่งผ่านรีโมตอินฟราเรด หน้าเว็บไม่รู้ว่าแอร์ติดอยู่หรือไม่)" : ""}</div>
    ${pinGet() ? "" : '<input type="password" inputmode="numeric" autocomplete="off" placeholder="รหัสสั่งงาน" id="pinIn">'}
    <div class="err" id="pinErr"></div>
    <div class="row"><button type="button" class="cancel" id="pinNo">ยกเลิก</button><button type="submit" class="go" id="pinGo">ยืนยัน${on ? "เปิด" : "ปิด"}</button></div></form>`;
  $("#dlg").classList.add("open"); ($("#pinIn") || $("#pinGo")).focus();
  $("#pinNo").onclick = closeDev;
  $("#pinForm").onsubmit = async (e) => {
    e.preventDefault();
    const pin = pinGet() || ($("#pinIn") ? $("#pinIn").value.trim() : "");
    if (!pin) { $("#pinErr").textContent = "ใส่รหัสสั่งงานก่อน"; return; }
    $("#pinGo").disabled = true; $("#pinGo").textContent = "กำลังส่งคำสั่ง…"; $("#pinErr").textContent = "";
    const r = await callFn({ device_id: id, on, pin });
    if (r.code === 401) { pinSet(""); askCmd(id, on); $("#pinErr").textContent = r.msg; return; }
    if (!r.ok) { $("#pinGo").disabled = false; $("#pinGo").textContent = "ลองอีกครั้ง"; $("#pinErr").textContent = r.msg; return; }
    pinSet(pin); closeDev(); toast("✓ " + nameOf(d) + " · " + r.msg);
    if (KIND(d) !== "ir") { (S.reads[id] = S.reads[id] || []).push({ device_id: id, t: Date.now(), ts: new Date().toISOString(), online: true, switch_on: on }); render(); }
  };
}
async function loadLog() { /* รายการการสั่งงานล่าสุด (iot_commands) — แสดงเมื่อเปิดใช้ปุ่มสั่งงาน */ }
document.addEventListener("click", (e) => { const c = e.target.closest("[data-ctl]"); if (c) { e.stopPropagation(); askCmd(c.dataset.ctl, c.dataset.on === "1"); } }, true);

/* ---------- ข้อมูลตัวอย่าง (?demo=1) ---------- */
function demoMeta() {
  return { demo5: { id: "demo5", label: "ห้องเย็น 2", loc: "ห้องเย็น WH29", t_max: 28, t_min: 18, map: "wh29", px: 1300, py: 700 }, demo4: { id: "demo4", label: "ห้องเย็น 1", loc: "ห้องเย็น WH29", t_max: 28, map: "wh29", px: 600, py: 620 },
    demo2: { id: "demo2", label: "คลัง 8 โซน DRVBC", t_max: 30, map: "wha", px: 520, py: 640 }, demo11: { id: "demo11", site: "WH5", label: "แอร์ทีม Admin", loc: "ออฟฟิศ", map: "wha", px: 2370, py: 1120 }, demo10: { id: "demo10", site: "WH8", label: "Skylight AA–AH", map: "wha", px: 700, py: 420 },
    demo0: { id: "demo0", map: "wha", px: 1320, py: 520 }, demo1: { id: "demo1", map: "wha", px: 1900, py: 900 }, demo3: { id: "demo3", map: "wha", px: 300, py: 950 }, demo6: { id: "demo6", map: "wha", px: 2300, py: 400 },
    demo7: { id: "demo7", map: "wha", px: 760, py: 1100 }, demo9: { id: "demo9", map: "wha", px: 1700, py: 1080 }, demo8: { id: "demo8", map: "wha", px: 420, py: 1100 } };
}
function demo() {
  const L = [["WH5-5AN", "qxj", "WH5", 29.8, 74], ["WH5-5BF", "qxj", "WH5", 29.8, 73], ["WH8-DRVBC", "qxj", "WH8", 30.2, 73], ["WH8-5BU", "qxj", "WH8", 29.7, 75], ["WH29-cool room1", "qxj", "WH29", 35, 50, 0], ["WH29-cool room2", "qxj", "WH29", 26, 60],
    ["WH5-CANTEEN AIR1", "wnykq", "WH5", 26.5, 67], ["WH8-BW-SHUTTLE", "dlq", "WH8", 4850], ["WH8-FAN1", "dlq", "WH8", 0, 0, 0], ["WH5-FAN2", "kg", "WH5"], ["SKYLIGHT_AA-AH", "znjdq", null], ["Air ทีมadmin", "infrared_ac", null, 0, 0, 0]];
  const now = Date.now(), devs = [], rows = [];
  L.forEach(([name, cat, site, a, b, on = 1], i) => {
    const id = "demo" + i; devs.push({ id, name, category: cat, site, online: !!on, updated_at: new Date(now - (on ? 0 : 5 * 3600e3)).toISOString() });
    for (let t = now - S.range * 3600e3; t <= now; t += 15 * 60000) {
      const h = new Date(t).getHours() + new Date(t).getMinutes() / 60, wave = Math.sin((h - 9) / 24 * 2 * Math.PI);
      const r = { device_id: id, ts: new Date(t).toISOString(), online: !!on };
      if (cat === "qxj" || cat === "wnykq") { r.temp_c = +(a + wave * 2 + Math.random() * .3).toFixed(1); r.humidity = Math.round(b - wave * 6); }
      if (cat === "dlq") { const w = h > 7 && h < 20 ? a * (0.8 + Math.random() * .3) : a * .1; r.power_w = on ? Math.round(w) : 0; r.voltage_v = 230 + Math.random() * 5; r.current_a = r.power_w / 230; r.energy_kwh = (t - now) / 3600e3 * a / 1000 + 100; }
      if (cat === "kg" || cat === "znjdq") r.switch_on = h > 6 && h < 19;
      if (!on && t > now - 5 * 3600e3) continue;
      rows.push(r);
    }
  });
  return { devs, rows };
}
setUI((location.search.match(/[?&]ui=([abc])/) || [])[1] || (() => { try { return localStorage.getItem(UI_KEY); } catch { return null; } })() || "b");
addEventListener("iot3d-ready", () => setUI(window.__ui));
load();
