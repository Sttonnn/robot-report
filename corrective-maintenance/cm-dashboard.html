<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrective Maintenance · ภาพรวมงานแจ้งซ่อม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f1f3f8; --ink: #17213a; --ink2: #5b6782; --ink3: #8a95ab; --line: #e6eaf2; --chip: #e9edf5;
    --done: #0f9a6e; --review: #7c3aed; --wait: #d97706; --prog: #2563eb; --cancel: #b8c0cf; --bad: #dc3b26;
    --acc: #f26b1d; --acc2: #c2410c;
    --shadow: 0 10px 26px rgba(23,33,58,.09); --shadow-s: 0 4px 14px rgba(23,33,58,.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  .num { font-family: Archivo, 'IBM Plex Sans Thai', sans-serif; font-variant-numeric: tabular-nums; }
  .lay { display: grid; grid-template-columns: 252px minmax(0,1fr); min-height: 100vh; }

  /* แถบซ้าย */
  .side { position: sticky; top: 0; height: 100vh; overflow: auto; background: #131c2e; color: #dfe5f1; padding: 18px 14px; display: flex; flex-direction: column; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .brand .ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(150deg,#ff9a3d,#e0480f); color: #fff; box-shadow: 0 8px 18px rgba(242,107,29,.35); flex: none; }
  .brand b { display: block; font-size: 15px; color: #fff; line-height: 1.2; } .brand small { font-size: 11.5px; color: #95a1ba; }
  .side h5 { margin: 4px 6px 4px; font-size: 11px; letter-spacing: .08em; color: #7d89a3; text-transform: uppercase; }
  .nav { display: grid; gap: 3px; }
  .nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; cursor: pointer; border: 0; border-radius: 12px; padding: 10px 12px; background: transparent; color: #cfd6e4; font-size: 14px; font-weight: 600; }
  .nav button:hover { background: rgba(255,255,255,.06); }
  .nav button.on { background: linear-gradient(150deg,#ff8a34,#e0480f); color: #fff; box-shadow: 0 8px 18px rgba(224,72,15,.3); }
  .nav button .c { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.12); }
  .nav button.on .c { background: rgba(255,255,255,.25); }
  .sites { display: grid; gap: 6px; }
  .sbtn { cursor: pointer; border: 1px solid rgba(255,255,255,.08); border-radius: 13px; padding: 9px 11px; background: rgba(255,255,255,.03); text-align: left; display: grid; gap: 5px; color: #dfe5f1; }
  .sbtn.on { border-color: #ff9a3d; background: rgba(255,138,52,.12); }
  .sbtn .r1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 13.5px; } .sbtn .r1 span { color: #95a1ba; font-size: 12px; font-weight: 600; }
  .sbtn .mini { display: flex; height: 6px; border-radius: 4px; overflow: hidden; gap: 1px; background: rgba(255,255,255,.08); }
  .guide { margin-top: auto; border-radius: 16px; padding: 13px 14px; background: linear-gradient(150deg,#ffe0a8,#ffbe5c); color: #3a2400; cursor: pointer; border: 0; text-align: left; display: grid; gap: 3px; }
  .guide b { font-size: 14px; } .guide span { font-size: 12px; }

  /* หัว */
  .hero { position: relative; overflow: hidden; padding: 20px clamp(16px,2.6vw,36px) 24px; color: #fff; background: linear-gradient(150deg,#1a2238 0%,#2b2240 46%,#6b2a12 100%); border-radius: 0 0 32px 32px; box-shadow: 0 18px 40px rgba(26,34,56,.25); }
  .hero .glow { position: absolute; border-radius: 999px; pointer-events: none; }
  .top { position: relative; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .back { display: inline-flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; font-size: 14px; font-weight: 700; padding: 9px 16px 9px 12px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.24); white-space: nowrap; }
  .ttl { display: grid; flex: 1 1 260px; min-width: 0; }
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.72); }
  h1 { margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; }
  h1 em { font-style: normal; font-family: Archivo, sans-serif; font-weight: 900; color: #ffb27a; font-size: .8em; margin-left: 8px; letter-spacing: .01em; }
  .asof { font-size: 12.5px; color: rgba(255,255,255,.75); }
  .upl { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: 0; border-radius: 14px; padding: 11px 18px; font-size: 14px; font-weight: 700; color: #7a2a06; background: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.25); white-space: nowrap; }
  .upl:hover { background: #fff1e6; }
  .syncst { font-size: 12px; color: rgba(255,255,255,.75); }
  .lnk { cursor: pointer; border: 0; background: none; padding: 0; color: rgba(255,255,255,.75); font-size: 12px; text-decoration: underline; }
  .fbar { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
  .fbox { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; border-radius: 14px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.8); }
  .fbox input, .fbox select { border: 0; border-radius: 10px; padding: 6px 10px; background: #fff; color: var(--ink); font-size: 13px; font-weight: 600; min-height: 32px; }
  .qk { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); flex-wrap: wrap; }
  .qk button { cursor: pointer; border: 0; border-radius: 10px; padding: 7px 12px; background: transparent; color: #fff; font-size: 13px; font-weight: 700; }
  .qk button.on { background: #fff; color: var(--ink); }

  .stats { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)) minmax(0,1.15fr); gap: 12px; margin-top: 16px; }
  .card { border-radius: 22px; padding: 15px 17px; background: #fff; color: var(--ink); box-shadow: 0 10px 24px rgba(0,0,0,.18); min-width: 0; display: grid; gap: 2px; align-content: start; border-top: 5px solid var(--c); }
  .card .lbl { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink2); }
  .card .lbl i { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, #fff); color: var(--c); flex: none; }
  .card .val { font-family: Archivo, sans-serif; font-size: 38px; font-weight: 900; line-height: 1.1; margin-top: 6px; }
  .card .val small { font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 14px; font-weight: 600; color: var(--ink2); margin-left: 4px; }
  .card .sub { font-size: 12px; color: var(--ink2); }
  .card.perf { display: flex; align-items: center; gap: 10px; padding-right: 12px; border-top-color: var(--done); }
  .card.perf .pt { display: grid; gap: 2px; min-width: 0; }

  main { padding: 22px clamp(16px,2.6vw,36px) 48px; display: grid; gap: 20px; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap: 18px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
  .panel { background: #fff; border-radius: 22px; box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
  .panel h2 { margin: 0; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .panel .hint { font-size: 12.5px; color: var(--ink2); margin: 3px 0 12px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--ink2); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink2); margin-bottom: 8px; font-weight: 600; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* กราฟแท่งรายเดือน */
  .mchart { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 6px; }
  .yax { position: relative; height: 240px; font-size: 11px; color: var(--ink3); text-align: right; }
  .yax span { position: absolute; right: 0; transform: translateY(50%); }
  .plot { position: relative; height: 240px; display: flex; align-items: flex-end; gap: 10px; border-bottom: 1px solid var(--line); }
  .plot .gl { position: absolute; left: 0; right: 0; border-top: 1px dashed #edf0f5; pointer-events: none; }
  .mcol { flex: 1; max-width: 64px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; margin: 0 auto; cursor: pointer; position: relative; }
  .mcol .tt { text-align: center; font-size: 12.5px; font-weight: 800; color: var(--ink); margin-bottom: 3px; }
  .mcol .stk { display: flex; flex-direction: column-reverse; gap: 2px; }
  .mcol .stk span { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 800; min-height: 2px; }
  .mcol .stk span:last-child { border-radius: 4px 4px 0 0; }
  .mcol:hover .stk { filter: brightness(1.06); outline: 2px solid var(--ink); outline-offset: 1px; }
  .xax { display: flex; gap: 10px; margin-left: 40px; }
  .xax span { flex: 1; max-width: 64px; margin: 0 auto; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--ink2); padding-top: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 12px; font-weight: 700; color: var(--ink2); background: #f6f7fb; padding: 9px 10px; position: sticky; top: 0; z-index: 1; }
  td { padding: 9px 10px; border-bottom: 1px solid #eef1f6; vertical-align: middle; }
  tr.ck { cursor: pointer; } tr.ck:hover td { background: #fff8f2; }
  .tw { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  .tw table { min-width: 760px; }
  .bar { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; background: #f0f2f7; min-width: 80px; }
  .bar span { height: 100%; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pri { display: inline-block; min-width: 28px; text-align: center; padding: 2px 7px; border-radius: 7px; font-size: 11.5px; font-weight: 800; }
  .pri.P1 { background: #fde3df; color: #a8250f; } .pri.P2 { background: #fdeccc; color: #8a4b05; } .pri.P3 { background: #e8edf6; color: #3a4a6b; }
  .over { color: var(--bad); font-weight: 700; font-size: 12px; }
  .muted { color: var(--ink2); font-size: 12.5px; }
  .pills { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: #fff; box-shadow: var(--shadow-s); flex-wrap: wrap; }
  .pills button { cursor: pointer; border: 0; border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 700; background: transparent; color: var(--ink2); white-space: nowrap; }
  .pills button.on { background: var(--ink); color: #fff; }
  .search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; padding: 4px 14px; border-radius: 999px; background: #fff; box-shadow: var(--shadow-s); min-width: 0; }
  .search input { border: 0; outline: 0; background: transparent; min-height: 36px; flex: 1; min-width: 0; font-size: 14px; }
  .more { cursor: pointer; border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 700; background: var(--chip); color: var(--ink); justify-self: center; }

  .hbar { display: grid; grid-template-columns: minmax(90px,170px) minmax(0,1fr) 46px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .hbar .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar .v { font-weight: 800; text-align: right; }
  .hbar .bar { height: 14px; border-radius: 4px; }
  .hbar.ck { cursor: pointer; border-radius: 8px; } .hbar.ck:hover .nm { color: var(--acc2); }

  .todo { display: grid; gap: 8px; }
  .titem { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: #f8f9fc; border-left: 4px solid var(--c); cursor: pointer; }
  .titem:hover { background: #fff5ec; }
  .titem .d { font-family: Archivo, sans-serif; font-weight: 900; font-size: 20px; text-align: center; line-height: 1; } .titem .d small { display: block; font-family: 'IBM Plex Sans Thai'; font-size: 10.5px; font-weight: 600; color: var(--ink2); }
  .titem b { font-size: 13.5px; } .titem .m { font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 26px; text-align: center; color: var(--ink2); }

  .pcards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
  .pc { border-radius: 16px; padding: 13px 14px; background: #f8f9fc; display: grid; gap: 4px; }
  .pc .h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
  .pc .n { font-family: Archivo, sans-serif; font-weight: 900; font-size: 28px; line-height: 1.1; }
  .pc .s { font-size: 12px; color: var(--ink2); }

  dialog { border: 0; border-radius: 22px; padding: 0; box-shadow: 0 30px 80px rgba(0,0,0,.3); width: min(720px, calc(100% - 28px)); max-height: calc(100vh - 40px); }
  dialog::backdrop { background: rgba(15,22,38,.5); }
  .dlg { padding: 20px 22px; display: grid; gap: 12px; }
  .dlg h3 { margin: 0; font-size: 18px; }
  .kv { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 6px 12px; font-size: 13.5px; } .kv span { color: var(--ink2); }
  .tl { display: flex; gap: 0; overflow-x: auto; padding: 6px 0; }
  .tl div { flex: 1; min-width: 96px; text-align: center; font-size: 11.5px; color: var(--ink2); position: relative; padding-top: 18px; }
  .tl div::before { content: ""; position: absolute; top: 5px; left: 50%; width: 11px; height: 11px; margin-left: -5px; border-radius: 50%; background: var(--c, #cfd6e3); z-index: 1; }
  .tl div::after { content: ""; position: absolute; top: 10px; left: 0; right: 0; height: 2px; background: #e3e7ef; }
  .tl div b { display: block; color: var(--ink); font-size: 12px; }
  .btn { cursor: pointer; border: 0; border-radius: 12px; padding: 9px 16px; font-weight: 700; font-size: 13.5px; background: var(--chip); color: var(--ink); }
  .btn.p { background: linear-gradient(150deg,#ff8a34,#e0480f); color: #fff; }
  .sumg { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
  .sumg div { background: #f6f7fb; border-radius: 12px; padding: 10px; text-align: center; } .sumg b { display: block; font-family: Archivo; font-size: 24px; } .sumg span { font-size: 12px; color: var(--ink2); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #17213a; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 600; z-index: 99; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
  .tip { position: fixed; z-index: 50; pointer-events: none; background: #17213a; color: #fff; border-radius: 10px; padding: 8px 11px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 24px rgba(0,0,0,.25); min-width: 150px; }
  .tip b { font-size: 12.5px; } .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .warn { border-radius: 14px; padding: 10px 14px; background: #fff7e6; color: #7a4a00; font-size: 13px; border: 1px solid #ffe0a3; }
  .sidebtn { display: none; }


  /* ===== แบบ B "แบบ BI" (ผู้ใช้เลือก 14 ต.ค. จาก A/B/C/D) · body.ui-b เสมอ ===== */
  .tnav { display: none; position: relative; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .tnav button { cursor: pointer; border: 0; border-radius: 12px; padding: 9px 15px; font-size: 13.5px; font-weight: 700; background: var(--chip); color: var(--ink2); display: inline-flex; align-items: center; gap: 7px; }
  .tnav button.on { background: var(--ink); color: #fff; }
  .tnav select { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 700; background: #fff; }
  .gbig { display: grid; justify-items: center; gap: 4px; text-align: center; }
  .gbig b { font-family: Archivo, sans-serif; font-size: 44px; font-weight: 900; line-height: 1; }

  /* B · แบบ BI: หัวขาว ไม่มีแถบซ้าย แท็บด้านบน การ์ดไอคอนใหญ่ */
  .ui-b .side, .ui-b .sidebtn { display: none !important; }
  .ui-b .lay { grid-template-columns: 1fr; }
  .ui-b .tnav { display: flex; }
  .ui-b .hero { background: #fff; color: var(--ink); border-radius: 0; box-shadow: 0 1px 0 var(--line); padding-bottom: 20px; }
  .ui-b .hero .glow { display: none; }
  .ui-b h1 { color: #1a2a6c; font-size: 32px; font-weight: 800; } .ui-b h1 em { color: #1a2a6c; display: block; margin: 0; font-size: 22px; }
  .ui-b .kicker, .ui-b .asof, .ui-b .syncst { color: var(--ink2); }
  .ui-b .back { color: var(--ink); background: var(--chip); border-color: var(--line); }
  .ui-b .upl { background: #1a2a6c; color: #fff; }
  .ui-b .fbox { background: #f4f6fa; border-color: var(--line); color: var(--ink2); } .ui-b .fbox input, .ui-b .fbox select { border: 1px solid var(--line); }
  .ui-b .qk { background: #f4f6fa; border-color: var(--line); } .ui-b .qk button { color: var(--ink2); } .ui-b .qk button.on { background: #1a2a6c; color: #fff; }
  .ui-b .card { border-top: 0; border-radius: 26px; box-shadow: 0 6px 22px rgba(26,42,108,.12); border: 1px solid #e3e8f4; text-align: center; justify-items: center; padding: 16px; }
  .ui-b .card .lbl { flex-direction: column; font-size: 16px; color: #1a2a6c; font-weight: 800; } .ui-b .card .lbl i { width: 56px; height: 56px; border-radius: 18px; } .ui-b .card .lbl i svg { width: 30px; height: 30px; }
  .ui-b .card .val { font-size: 50px; color: #1a2a6c; } .ui-b .card .val small { display: block; font-size: 17px; color: #1a2a6c; margin: 0; }
  .ui-b .card.perf { flex-direction: column; } .ui-b .panel h2 { color: #1a2a6c; font-size: 19px; } .ui-b .panel { border-radius: 26px; border: 1px solid #e3e8f4; }
  .ui-b th { background: #1a2a6c; color: #fff; }

  @media (max-width: 1280px) { .stats { grid-template-columns: repeat(3, minmax(0,1fr)); } .grid3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 1100px) {
    .lay { grid-template-columns: 1fr; }
    .side { position: fixed; left: 0; top: 0; z-index: 60; width: 270px; transform: translateX(-105%); transition: transform .2s; }
    .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(10,15,30,.45); }
    .sidebtn { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,.24); background: rgba(255,255,255,.12); color: #fff; border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 13.5px; }
    .grid2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) { .stats { grid-template-columns: 1fr 1fr; } .card.perf { grid-column: 1 / -1; } .grid3, .pcards { grid-template-columns: 1fr; } h1 { font-size: 22px; } .card .val { font-size: 30px; } .kv { grid-template-columns: 1fr; } .sumg { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="lay">
<aside class="side" id="side" aria-label="เมนู"></aside>
<div style="min-width:0">
<header class="hero">
  <div class="glow" style="top:-60%;right:-10%;width:46vw;height:46vw;background:radial-gradient(circle,rgba(255,120,40,.45),rgba(255,120,40,0) 66%)"></div>
  <div class="glow" style="top:-40%;left:-12%;width:40vw;height:40vw;background:radial-gradient(circle,rgba(80,110,255,.3),rgba(80,110,255,0) 66%)"></div>
  <div class="top">
    <button class="sidebtn" id="sideBtn" type="button">☰ เมนู</button>

    + card(GM.done.c, IC.ok, "ดำเนินการแล้วเสร็จ", c.fin, `รวมงานที่รอตรวจรับ ${base().filter(r => r.rev).length}`)

/* กราฟรายเดือน (แท่งซ้อน) + hover */
function monthChart(a) {
  const M = {}; a.forEach(r => { const k = r.created.slice(0, 7); (M[k] = M[k] || []).push(r); });
  const ks = Object.keys(M).sort(); if (!ks.length) return '<div class="empty">ไม่มีข้อมูลในช่วงนี้</div>';
  const cs = ks.map(k => stat(M[k])), mx = Math.max(...cs.map(c => c.n)), step = mx <= 10 ? 2 : mx <= 40 ? 10 : mx <= 100 ? 20 : 50, top = Math.ceil(mx / step) * step || 1;
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  return `<div class="legend">${G.map(g => `<span><i style="background:${g.c}"></i>${g.t}</span>`).join("")}</div>
    <div class="mchart"><div class="yax">${ticks.map(v => `<span style="bottom:${v / top * 100}%">${v}</span>`).join("")}</div>
    <div class="plot">${ticks.slice(1).map(v => `<div class="gl" style="bottom:${v / top * 100}%"></div>`).join("")}
      ${cs.map((c, i) => `<div class="mcol" data-month="${ks[i]}" data-tip="${esc(JSON.stringify({ t: ymL(ks[i]), c }))}"><div class="tt num">${c.n}</div><div class="stk" style="height:${c.n / top * 100}%">${G.map(g => c[g.k] ? `<span style="flex:${c[g.k]};background:${g.c};${g.k === "cancel" ? "color:#3b4560" : ""}">${c[g.k] / top >= .07 ? c[g.k] : ""}</span>` : "").join("")}</div></div>`).join("")}
    </div></div><div class="xax">${ks.map(k => `<span>${ymL(k)}</span>`).join("")}</div>`;
}

  return `<div class="tw"><table><thead><tr><th>อาคาร</th><th>งาน</th><th>สถานะ</th><th>%Performance</th><th>กำลังทำ</th><th>รออนุมัติ</th><th>เกิน SLA</th><th>เวลาแจ้ง→ปิดเฉลี่ย</th></tr></thead><tbody>

function perfBig(c) {
  const p = Math.min(100, c.perf), col = p >= 90 ? GM.done.c : p >= 75 ? GM.wait.c : "#dc3b26", a = Math.PI * (1 - p / 100), nx = 100 + 62 * Math.cos(a), ny = 100 - 62 * Math.sin(a);
  return `<div class="gbig"><svg width="240" height="140" viewBox="0 0 200 116" aria-hidden="true"><path d="M20 100a80 80 0 0 1 160 0" fill="none" stroke="#e7ebf2" stroke-width="22" stroke-linecap="round"/><path d="M20 100a80 80 0 0 1 160 0" fill="none" stroke="${col}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${251.3 * p / 100} 252"/><line x1="100" y1="100" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#1a2a6c" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="9" fill="#1a2a6c"/></svg>
    <b class="num" style="color:${col}">${c.valid ? c.perf.toFixed(1) : "–"}%</b><span class="muted">แล้วเสร็จ ${c.fin} จาก ${c.valid} งาน </span></div>`;
}
function renderTnav() {

    + `<select id="tSite"><option value="">ทุกอาคาร</option>${sites.map(x => `<option ${S.site === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select><button type="button" id="guideBtn2" data-guide>📖 คู่มือ</button>`;
  $("tSite").onchange = e => { S.site = e.target.value; render(); };
}
function render() { renderFilters(); renderTnav(); renderSide(); renderStats(); renderMain(); }

/* รายละเอียดใบงาน */
function openWO(id) {
  const r = DATA.find(x => x.id === id); if (!r) return;
  const steps = [["แจ้งซ่อม", r.created], ["อนุมัติ", r.approved], ["มอบหมาย", r.assigned], ["เริ่มงาน", r.started], ["ปิดงาน", r.closed]];
  $("dlg").innerHTML = `<div class="dlg"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3>${esc(r.wo)}</h3>${stPill(r)}<span class="pri ${esc(r.pri)}">${esc(r.pri)} ${esc(r.priName)}</span>${r.over && r.g !== "cancel" ? '<span class="over">เกิน SLA</span>' : ""}<button class="btn" data-close style="margin-left:auto">ปิด</button></div>
    <div style="font-size:15px;font-weight:600">${esc(r.desc) || "–"}</div>
    <div class="tl">${steps.map(([t, d]) => `<div style="--c:${d ? GM.done.c : "#cfd6e3"}"><b>${t}</b>${tht(d)}</div>`).join("")}</div>
    <div class="kv"><span>อุปกรณ์</span><b>${esc(r.eq)} <span class="muted">(${esc(r.eqCode)})</span></b><span>สถานที่</span><span style="color:var(--ink)">${esc(r.site)} · ${esc(r.loc)} <span class="muted">${esc(r.locCode)}</span></span>
      <span>คลัง</span><span style="color:var(--ink)">${esc(r.plant)} · ${esc(r.unit)}</span><span>แผนกผู้แจ้ง</span><span style="color:var(--ink)">${esc(r.dept) || "–"}</span>
      <span>กลุ่มอาการเสีย</span><span style="color:var(--ink)">${esc(r.sym.join(", ")) || "–"} ${r.symName ? `<span class="muted">· ${esc(r.symName)}</span>` : ""}</span>
      <span>สาเหตุ</span><span style="color:var(--ink)">${esc(r.cause) || "–"}</span><span>วิธีแก้ไข</span><span style="color:var(--ink)">${esc(r.fix) || "–"}</span>
      <span>กำหนดเสร็จ (SLA)</span><span style="color:var(--ink)">${tht(r.due)} · ${esc(r.sla)}</span><span>แจ้ง → ปิดงาน</span><span style="color:var(--ink)">${fmtH(hrs(r.created, r.closed))}</span>
      <span>คะแนนประเมิน</span><span style="color:var(--ink)">${r.score != null ? "★".repeat(r.score) + ` (${r.score}/5)` : "–"}</span><span>ประวัติซ่อมอุปกรณ์นี้</span><span style="color:var(--ink)">${r.repairs != null ? r.repairs + " ครั้ง" : "–"}</span>
      <span>หน่วยที่รับผิดชอบ</span><span style="color:var(--ink)">${esc(r.team) || "–"}</span></div></div>`;
  $("dlg").showModal();
}
function guide() {
  $("dlg").innerHTML = `<div class="dlg"><div style="display:flex;align-items:center"><h3>📖 คู่มือการอ่าน</h3><button class="btn" data-close style="margin-left:auto">ปิด</button></div>
    <div class="kv" style="grid-template-columns:170px 1fr">${G.map(g => `<span><span class="pill" style="background:${g.c}1f;color:${g.c}"><i></i>${g.t}</span></span><span style="color:var(--ink)">${{ done: "ปิดงานแล้ว (Completed / CLOSE) + ซ่อมเสร็จรอตรวจรับ (Send to Review)", wait: "แจ้งแล้ว รอคลังอนุมัติ", prog: "อนุมัติแล้ว มอบหมาย/ช่างกำลังซ่อม (Assignment ฯลฯ)", cancel: "ยกเลิก (Cancelled) / ไม่อนุมัติ (Reject) · ไม่นับใน %Performance" }[g.k]}</span>`).join("")}</div>
    <p style="margin:0;font-size:13.5px;line-height:1.7">งานที่ <b>ยกเลิก / ไม่อนุมัติ</b> (Cancelled / Reject) ไม่นับในทุกตัวเลข<br><b>%Performance</b> = เสร็จสิ้น ÷ งานทั้งหมด · เขียว ≥ 90% · ส้ม 75–89% · แดง &lt; 75%<br><b>เกิน SLA</b> = ตามช่อง "เกิน SLA" ในระบบแจ้งซ่อม · <b>อาคาร</b> = จากรหัสสถานที่ (WHA05-<b>32</b>-001 → WH32)<br>
    <b>อัปโหลด</b>: Export ไฟล์ TrackingWorkOrder (ชีต Report) จากระบบ → ปุ่ม "อัปโหลด Excel แจ้งซ่อม" → ตรวจสรุปแล้วกดบันทึก · รวมกับของเดิม ไม่ลบใบงานเดิม · ไม่เก็บชื่อพนักงาน</p></div>`;
  $("dlg").showModal();
}

/* อัปโหลด */
let PEND = null;
function loadXLSX() { return window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"; s.onload = ok; s.onerror = () => no(new Error("โหลดตัวอ่าน Excel ไม่สำเร็จ")); document.head.appendChild(s); }); }
async function upload(f) {
  try {
    await loadXLSX();
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array" }), sh = wb.Sheets.Report || wb.Sheets[wb.SheetNames[0]];
    const rows = cmParse.parse(XLSX.utils.sheet_to_json(sh, { header: 1, raw: true }));
    if (!rows.length) throw new Error("ไม่พบใบงานในไฟล์");
    const asof = cmParse.asofOf(f.name) || new Date(Date.now() + 7 * 36e5).toISOString().slice(0, 16);
    const cur = new Map(DATA.map(r => [r.id, r])), inF = new Set(rows.map(r => r.id)), m = { add: [], chg: [], same: 0, up: [] };
    rows.forEach(r => { const o = cur.get(r.id); if (!o) { m.add.push(r); m.up.push(r); } else if (JSON.stringify(o) !== JSON.stringify(r)) { m.chg.push([o, r]); m.up.push(r); } else m.same++; });
    const kept = DATA.filter(r => !inF.has(r.id)).length, older = asof < ASOF;
    PEND = { f: f.name, asof, rows, m, kept, older };
    $("dlg").innerHTML = `<div class="dlg"><h3>ตรวจก่อนบันทึก · ${esc(f.name)}</h3>
      ${older ? `<div class="warn">ไฟล์นี้เก่ากว่าข้อมูลปัจจุบัน (${tht(ASOF)}) · จะเพิ่มเฉพาะใบงานใหม่ ไม่ย้อนสถานะใบงานเดิม</div>` : ""}
      <div class="sumg"><div><b>${m.add.length}</b><span>ใบงานใหม่</span></div><div><b>${older ? 0 : m.chg.length}</b><span>อัปเดต</span></div><div><b>${m.same}</b><span>เหมือนเดิม</span></div><div><b>${kept}</b><span>เก็บไว้ (ไม่อยู่ในไฟล์)</span></div></div>
      ${!older && m.chg.length ? `<div style="max-height:220px;overflow:auto"><table><thead><tr><th>ใบงาน</th><th>สถานะเดิม</th><th>สถานะใหม่</th></tr></thead><tbody>${m.chg.filter(([o, r]) => o.st !== r.st).map(([o, r]) => `<tr><td>${esc(r.wo)}</td><td>${stPill(o)}</td><td>${stPill(r)}</td></tr>`).join("") || '<tr><td colspan="3" class="muted">สถานะไม่เปลี่ยน (เปลี่ยนรายละเอียดอื่น)</td></tr>'}</tbody></table></div>` : ""}
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>ยกเลิก</button><button class="btn p" data-commit>✓ บันทึก</button></div></div>`;
    $("dlg").showModal();
  } catch (err) { toast("อัปโหลดไม่สำเร็จ: " + err.message); }
}
async function commit() {
  const P = PEND; if (!P) return; PEND = null;
  const mp = new Map(DATA.map(r => [r.id, r])), up = P.older ? P.m.add : P.m.up;
  up.forEach(r => mp.set(r.id, r)); DATA = [...mp.values()]; if (!P.older) ASOF = P.asof;
  const l = { at: new Date(Date.now() + 7 * 36e5).toISOString().slice(0, 16), file: P.f, asof: P.asof, older: P.older, total: P.rows.length, added: P.m.add.length, changed: P.older ? 0 : P.m.chg.length, same: P.m.same, kept: P.kept };
  LOG.push(l); ls.set(DBK, { asof: ASOF, rows: DATA }); ls.set(LOGK, LOG);
  $("dlg").close(); render();
  if (SBOK) { try { await sbUp("cm_work_orders", up.map(r => ({ id: r.id, rec: r }))); await sbUp("cm_upload_log", [{ id: logId(l), rec: l }]); toast(`บันทึกแล้ว · ใหม่ ${l.added} · อัปเดต ${l.changed}`); } catch (e) { toast("บันทึกขึ้นระบบไม่สำเร็จ: " + e.message); } }
  else toast("บันทึกในเบราว์เซอร์นี้แล้ว (ยังไม่เชื่อมระบบ)");
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }

/* เหตุการณ์ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-guide],[data-view],[data-site],[data-st],[data-wo],[data-qk],[data-month],[data-qloc],[data-qeq],[data-close],[data-commit],#guideBtn,#uplBtn,#sideBtn");
  if (!t) { if (!e.target.closest("#side")) $("side").classList.remove("open"); return; }
  if ("guide" in t.dataset) { guide(); return; }
  if (t.id === "uplBtn") { $("file").click(); return; }
  if (t.id === "sideBtn") { $("side").classList.toggle("open"); return; }
  if (t.id === "guideBtn") { guide(); return; }
  if ("close" in t.dataset) { $("dlg").close(); PEND = null; return; }
  if ("commit" in t.dataset) { commit(); return; }
  if (t.dataset.wo) { openWO(t.dataset.wo); return; }
  if (t.dataset.qk) { const d = today(), y = d.slice(0, 4), m = d.slice(0, 7); S.qk = t.dataset.qk;
    if (S.qk === "all") { S.from = S.to = ""; } else if (S.qk === "m") { S.from = m + "-01"; S.to = d; } else if (S.qk === "y") { S.from = y + "-01-01"; S.to = d; }
    else { const x = new Date(d); x.setMonth(x.getMonth() - 2); S.from = x.toISOString().slice(0, 7) + "-01"; S.to = d; } render(); return; }
  if (t.dataset.month) { const m = t.dataset.month, e2 = new Date(+m.slice(0, 4), +m.slice(5), 0).getDate(); S.from = m + "-01"; S.to = m + "-" + String(e2).padStart(2, "0"); S.qk = ""; S.view = "list"; S.st = ""; history.replaceState(null, "", "#list"); render(); scrollTo(0, 0); return; }
  if ("qloc" in t.dataset || "qeq" in t.dataset) { S.q = t.dataset.qloc || t.dataset.qeq; S.view = "list"; S.st = ""; history.replaceState(null, "", "#list"); render(); scrollTo(0, 0); return; }
  if ("site" in t.dataset) { S.site = t.dataset.site; $("side").classList.remove("open"); render(); return; }
  if ("st" in t.dataset && !t.dataset.view) { S.st = t.dataset.st; S.n = 50; renderMain(); return; }
  if (t.dataset.view) { S.view = t.dataset.view; if ("st" in t.dataset) S.st = t.dataset.st; history.replaceState(null, "", "#" + S.view); $("side").classList.remove("open"); render(); scrollTo(0, 0); }
});
$("file").onchange = e => { const f = e.target.files[0]; if (f) upload(f); e.target.value = ""; };
$("dFrom").onchange = e => { S.from = e.target.value; S.qk = ""; render(); };
$("dTo").onchange = e => { S.to = e.target.value; S.qk = ""; render(); };
$("fPlant").onchange = e => { S.plant = e.target.value; S.site = ""; render(); };
$("fPri").onchange = e => { S.pri = e.target.value; render(); };
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]"), tip = $("tip");
  if (!t) { tip.hidden = true; return; }
  const d = JSON.parse(t.dataset.tip);
  tip.innerHTML = `<b>${esc(d.t)} · ${d.c.n} รายการ</b><br>${G.map(g => d.c[g.k] ? `<i style="background:${g.c}"></i>${g.t} ${d.c[g.k]}` : "").filter(Boolean).join("<br>")}<br>%Performance ${d.c.perf.toFixed(1)}%`;
  tip.hidden = false; const w = tip.offsetWidth; tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
});

/* เชื่อมทุกเครื่อง: Supabase cm_work_orders / cm_upload_log (id, rec jsonb) · ไม่มีตาราง = เก็บในเครื่องนี้ · SQL: tools/cm.sql */
const SBU = "https://mgnshovnibcmiptoxdfe.supabase.co/rest/v1/", SBK = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbnNob3ZuaWJjbWlwdG94ZGZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNzI1NDIsImV4cCI6MjEwNDk0ODU0Mn0.UoPu-i6ODMEgyuqoO6oKHf0JIqFKpWkSpBkOKrpITwQ";
const sbH = x => Object.assign({ apikey: SBK, Authorization: "Bearer " + SBK, "Content-Type": "application/json" }, x || {});
let SBOK = null;
const logId = l => l.at + "|" + l.file;
async function sbAll(t) { let out = []; for (let from = 0; ; from += 1000) { const r = await fetch(SBU + t + "?select=id,rec&order=id", { headers: sbH({ Range: from + "-" + (from + 999) }) }); if (!r.ok) throw new Error(t + " " + r.status); const a = await r.json(); out = out.concat(a); if (a.length < 1000) return out; } }
async function sbUp(t, rows) { const at = new Date().toISOString(); for (let i = 0; i < rows.length; i += 400) { const r = await fetch(SBU + t + "?on_conflict=id", { method: "POST", headers: sbH({ Prefer: "resolution=merge-duplicates,return=minimal" }), body: JSON.stringify(rows.slice(i, i + 400).map(x => ({ id: x.id, rec: x.rec, updated_at: at }))) }); if (!r.ok) throw new Error(t + " " + r.status); } }
function syncLabel() { const el = $("syncSt"); el.textContent = SBOK === null ? "กำลังเชื่อมข้อมูล…" : SBOK ? "✓ เชื่อมทุกเครื่องแล้ว · ไฟล์ TrackingWorkOrder*.xlsx" : "⚠ ยังไม่เชื่อม: ข้อมูลอยู่ในเครื่องนี้เท่านั้น"; el.style.color = SBOK === false ? "#ffd27a" : ""; }
async function sbSync() {
  if (location.protocol === "file:") { SBOK = false; syncLabel(); return; }
  try {
    const [w, l] = await Promise.all(["cm_work_orders", "cm_upload_log"].map(sbAll));
    const rl = new Map(l.map(x => [x.id, x.rec])), pushLog = LOG.filter(x => !rl.has(logId(x))); pushLog.forEach(x => rl.set(logId(x), x));
    LOG = [...rl.values()].sort((a, b) => a.at.localeCompare(b.at)).slice(-60);
    const rAsof = LOG.filter(x => !x.older).map(x => x.asof).sort().pop() || "", rRows = w.map(x => x.rec).filter(r => r && typeof r.id === "string" && typeof r.created === "string" && Array.isArray(r.sym) && GALL.includes(r.g));
    if (!rRows.length || ASOF > rAsof) { const mp = new Map(rRows.map(r => [r.id, r])); DATA.forEach(r => mp.set(r.id, r)); DATA = [...mp.values()]; await sbUp("cm_work_orders", DATA.map(r => ({ id: r.id, rec: r }))); }
    else { DATA = rRows; ASOF = rAsof; }
    if (pushLog.length) await sbUp("cm_upload_log", pushLog.map(x => ({ id: logId(x), rec: x })));
    ls.set(DBK, { asof: ASOF, rows: DATA }); ls.set(LOGK, LOG); SBOK = true;
  } catch (err) { SBOK = false; console.warn("CM sync", err); }
  syncLabel(); render();
}
render(); syncLabel(); sbSync();
</script>
